  - record_key: FUL-ENT-0011
    kind: entity
    capability_key: order-fulfillment
    requirement: >
      The system SHALL keep, for each supplier order, an order id that is unique, an order
      date that is always present, an order status, a shipping contact with address, and
      its order lines; each line SHALL always carry an ordered quantity, a shipped
      quantity and a unit price, plus category, product, item and line number.
