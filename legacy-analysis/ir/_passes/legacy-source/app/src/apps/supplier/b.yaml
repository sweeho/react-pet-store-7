  - record_key: FUL-BR-0010
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      GIVEN a received purchase order cannot be read, cannot be stored, or its invoice
      cannot be published WHEN the supplier processes it THEN the system SHALL fail the
      whole receipt so that none of its effects (stored order, stock reductions, shipped
      quantities) are kept and the message is not consumed.
    plain_text: >
      If anything goes wrong while taking in an order (unreadable, cannot be saved, the
      invoice cannot be sent), the supplier undoes the whole receipt instead of keeping
      half of it.
    technical_note: >
      onMessage converts TransitionException, CreateException, XMLDocumentException and
      JMSException into EJBException; onMessage, processPO and the inventory methods run
      with trans-attribute Required, so a system exception rolls back the container
      transaction. Redelivery behaviour depends on the JMS provider and is not configured
      in this module. Exception: an error while building the invoice is caught inside
      processAnOrder and does NOT roll back (see suspected defects).
    interface: false
    confidence: medium
    confidence_basis: >
      The exception wrapping is explicit and the Required attributes are declared, but the
      rollback and redelivery consequence is container behaviour inferred, not read.
    risk_class: operational
    basis: >
      Every checked exception in onMessage is rethrown as EJBException.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 114
        line_end: 122
