  - capability_key: order-fulfillment
    record_keys: [FUL-BR-0007, FUL-BR-0006, FUL-BR-0003]
    severity: high
    category: error-swallowed
    title: Invoice build failure keeps stock reductions and shipped lines but sends no invoice
    description: >
      Stock is reduced and each line is marked fully shipped (and the order possibly set
      COMPLETED) before the invoice is built. If building the invoice fails, the error is
      printed and swallowed and null is returned, so the transaction commits: the goods are
      recorded as shipped, the order may be COMPLETED, and no invoice is ever sent. Because
      the lines now count as shipped, a later retry skips them, so the invoice is lost for
      good. The comment claims the order "can be fullfilled later", which the shipped
      quantities prevent.
    traces:
