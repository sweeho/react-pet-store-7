  - record_key: FUL-BR-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL ship an order line only when the stock on hand for the line's item
      is at least the full quantity ordered on that line, and SHALL then reduce the stock
      by that full quantity and record the whole line quantity as shipped. GIVEN stock is
      lower than the line quantity WHEN the order is processed THEN nothing of that line
      is shipped and stock is unchanged (a line is never split).
    plain_text: >
      A line of an order is shipped only if there is enough stock for the whole line. If
      there is, the stock goes down by that amount; if not, none of that line is shipped.
    technical_note: >
      OrderFulfillmentFacadeEJB.checkInventory compares InventoryLocal.getQuantity with
      LineItemLocal.getQuantity and calls reduceQuantity; processAnOrder then sets
      quantityShipped = quantity on the line. InventoryEJB.reduceQuantity subtracts.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced by the comparison in checkInventory, the method comment states the same
      rule, and processAnOrder sets quantityShipped only after a successful check.
    risk_class: financial
    basis: >
      "@return false if number of items in inventory is less than number in the line item
      of po; else return true."
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              // swallow the finder exception because this means
              // supplier has not been populated; So we cant fulfill
              // this part of the order now
              return(false);
            }
            return(true);
          }
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 189
        line_end: 195
        excerpt: |
          if(!checkInventory(li)) {
            allItemsAvailable = false;
            continue;
          }
          li.setQuantityShipped(li.getQuantity());
          items.put(li.getItemId(), OrderStatusNames.COMPLETED);
          invoiceReqd = true;
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 82
        line_end: 85
        excerpt: |
