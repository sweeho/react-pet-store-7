  - record_key: FUL-BR-0006
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL allow partial shipment of an order: in one pass it SHALL ship every
      line that has enough stock, and SHALL set the supplier order status to COMPLETED only
      when every line not yet shipped could be shipped in that pass. GIVEN at least one
      line cannot be shipped WHEN the order is processed THEN the order SHALL stay PENDING
      and the lines that could ship SHALL still ship.
    plain_text: >
      The supplier ships what it can straight away. The order counts as complete only once
      every line has been shipped; until then it stays pending.
    technical_note: >
      processAnOrder keeps allItemsAvailable true unless a checkInventory call fails, and
      calls po.setPoStatus(OrderStatusNames.COMPLETED) only when it stayed true. Lines that
      passed are shipped regardless.
    interface: false
    confidence: high
    confidence_basis: >
      The code is explicit, and the user guide's status table defines COMPLETED as "All
      lines shipped and invoiced", which matches. Two independent sources.
    risk_class: operational
    basis: >
      Status is only changed to COMPLETED when allItemsAvailable is still true after the
      loop; there is no other status change in the supplier module.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 198
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;

              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }//end while
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
      - kind: document
        path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 5. Order status"
        line_start: 79
        line_end: 84
        excerpt: |
          5. Order status
          StatusMeaning
          PENDINGWaiting for the administrator to approve or deny
          APPROVEDApproved and sent to the Supplier, not yet fully invoiced
          DENIEDRefused by the administrator
          COMPLETEDAll lines shipped and invoiced

  - record_key: FUL-BR-0007
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN at least one line ships in a fulfilment pass THEN the system SHALL produce one
      invoice for that pass containing the order id, the original order date, a shipping
      date equal to the current date and time, and, for each line shipped in that pass
      only, its category, product, item, line number, quantity and unit price. WHEN no
      line ships THEN the system SHALL produce no invoice.
    plain_text: >
      Each time something ships, the supplier issues an invoice listing only the lines
      shipped that time, dated today, with the original order date and the line prices.
      Nothing shipped means no invoice.
    technical_note: >
      OrderFulfillmentFacadeEJB.createInvoice builds a TPAInvoiceXDE document; it adds a
      line only if its itemId is in the map of lines shipped in this pass. processAnOrder
      calls it only when invoiceReqd is true. The invoice user id is the literal
      "Dear PetStore Customer".
    interface: true
    confidence: high
    confidence_basis: >
      The code is explicit, and the processPO javadoc says the method "may return null if
      the invoice has no items or nothing could be shipped now". The invoice schema itself
      lives in another component and was not read.
    risk_class: financial
    basis: >
      createInvoice sets order id, order date, shipping date = new Date() and adds only
      lines present in newLis; processAnOrder builds newLis from lines shipped in the pass.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 145
        line_end: 171
        excerpt: |
          private String createInvoice(SupplierOrderLocal po, HashMap newLis)
            throws XMLDocumentException {
              invoiceXDE.newDocument();
              invoiceXDE.setOrderId(po.getPoId());
              invoiceXDE.setUserId("Dear PetStore Customer");
              Date poDate = new Date(po.getPoDate());
              invoiceXDE.setOrderDate(poDate);
              Date curDate = new Date();
              invoiceXDE.setShippingDate(curDate);
              Collection items = po.getLineItems();
              Iterator it = items.iterator();
              while((it != null) && (it.hasNext())) {
                LineItemLocal anItem = (LineItemLocal)it.next();
                if(newLis.containsKey(anItem.getItemId())) {
                  invoiceXDE.addLineItem(anItem.getCategoryId(),
                                         anItem.getProductId(),
                                         anItem.getItemId(),
                                         anItem.getLineNumber(),
                                         anItem.getQuantity(),
                                         anItem.getUnitPrice());
                }
              }//end while

              String invDoc = null;
              invDoc = invoiceXDE.getDocumentAsString();
              return(invDoc);
          }
