  - record_key: FUL-INT-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL receive each supplier purchase order from the order processing
      center as an asynchronous text message carrying the order as an XML document, and
      SHALL process every received order (persist it and attempt to fulfil it).
    plain_text: >
      The supplier receives purchase orders from the order processing center as messages
      and works on each one as soon as it arrives.
    technical_note: >
      SupplierOrderMDB.onMessage reads the TextMessage body and calls
      OrderFulfillmentFacade.processPO. The MDB listens on the queue bound in
      sun-j2ee-ri.xml as jms/supplier/PurchaseOrderQueue; ejb-jar.xml declares a
      javax.jms.Queue destination and a Required container transaction on onMessage.
    interface: true
    confidence: high
    confidence_basis: >
      Declared in two places (ejb-jar.xml message-driven destination and the
      sun-j2ee-ri.xml queue binding) and implemented in the MDB code. The sending side
      lives in another module and was not read in this pass.
    risk_class: operational
    basis: >
      The MDB comment says it "receives purhase orders from the OPC component, processes
      the orders, and, if orders are shipped, sends back the invoice"; onMessage casts the
      message to TextMessage and passes its text to processPO.
    traces:
