  # ---------------------------------------------------------------- catalog-data-maintenance
  - record_key: CDM-REQ-0001
    kind: requirement
    capability_key: catalog-data-maintenance
    requirement: >
      The system SHALL load the supplier's initial stock from a seed data file on request,
      only when no stock records exist yet, unless a forced reload is requested. WHEN a
      load runs THEN for each item in the file the system SHALL replace any existing stock
      record for that item with the file's quantity. GIVEN the existing stock cannot be
      read THEN the system SHALL treat it as empty and load.
    plain_text: >
      On first use the supplier's stock is filled in from a data file. It is not reloaded
      if stock already exists, unless a forced reload is asked for, which resets the listed
      items to the file's values.
    technical_note: >
      PopulateServlet (/Populate, init-param PopulateData=/populate/Populate-UTF8.xml)
      calls InventoryPopulator.check() unless forcefully=true; check returns false on empty
      or on any exception. createInventory removes an existing record then creates it. A
      missing quantity attribute defaults to 0 in code (the DTD makes it required).
    interface: false
    confidence: high
    confidence_basis: >
      Declared in web.xml (servlet and data path) and implemented in the servlet and
      populator.
    risk_class: operational
    basis: >
      populate(): "if (forcefully || !alreadyPopulated)" parses the data file.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/tools/populate/PopulateServlet.java
        line_start: 98
        line_end: 124
        excerpt: |
          private boolean populate(boolean forcefully) throws PopulateException {
            XMLReader reader = null;
            boolean alreadyPopulated = false;
            try {
              SAXParserFactory parserFactory = SAXParserFactory.newInstance();
              //parserFactory.setValidating(true);
              parserFactory.setNamespaceAware(true);
              reader = parserFactory.newSAXParser().getXMLReader();
              InventoryPopulator inventoryPopulator = new InventoryPopulator();
              if (!forcefully) {
                try {
                  alreadyPopulated = inventoryPopulator.check();
                } catch (PopulateException exception) {}
                //System.err.println("Already populated: " + alreadyPopulated);
              }
              if (forcefully || !alreadyPopulated) {
                try {
