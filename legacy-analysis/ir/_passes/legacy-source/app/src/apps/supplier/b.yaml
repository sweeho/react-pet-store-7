    requirement: >
      WHEN the supplier data load is triggered from the "populating" page THEN the system
      SHALL show "Please wait while the Java Pet Store Supplier Application is being
      populated...", run the load, and on success redirect to the requested success page
      (the storefront main screen), otherwise to the referring page. GIVEN the load fails
      THEN the system SHALL redirect to the requested error page, or report an error if
      none was given.
    plain_text: >
      While the supplier data is loading a wait message is shown; afterwards the user is
      taken on to the shop's main page, or to an error page if loading failed.
    technical_note: >
      populating.jsp meta-refreshes to Populate?success_page=//petstore/main.screen and
      passes the forcefully parameter through. PopulateServlet.doPost handles
      success_page, error_page and Referer; a path starting with "//" is resolved against
      the request URL host.
    interface: false
    confidence: medium
    confidence_basis: >
      One implementation path; no document describes the populate flow.
    risk_class: operational
    basis: >
      doPost redirect logic and the populating page refresh target.
