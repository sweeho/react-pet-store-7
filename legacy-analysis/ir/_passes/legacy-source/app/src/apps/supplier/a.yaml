  - record_key: FUL-INT-0008
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL accept supplier orders in the trading-partner supplier order
      XML format and convert them to the internal supplier order (shipping contact
      and address, e-mail, phone, and lines with category, product, item, line
      number, quantity and unit price); a document that cannot be parsed or
      converted SHALL be rejected rather than recorded.
    plain_text: >
      Orders arrive from the order centre in an agreed XML format, which the supplier
      translates into its own order record. An order it cannot read is not saved.
    technical_note: >
      TPASupplierOrderXDE selects a stylesheet by schema URI from
      SupplierOrderStyleSheetCatalog.properties (TPASupplierOrder.xsl for the TPA DTD
      and XSD forms) and builds SupplierOrder.fromDOM. Whether the input is
      validated is controlled by env-entries param/xml/validation/SupplierOrder and
      param/xml/SupplierOrderSchema, whose values are redacted in this copy.
      An XMLDocumentException propagates out of processPO and onMessage as an
      EJBException.
    interface: true
    confidence: medium
    confidence_basis: >
      The transform and mapping are readable, but the validation switches are
      redacted, so whether invalid-but-well-formed documents are rejected cannot be
      seen.
    risk_class: operational
    basis: >
