  - record_key: FUL-BR-0009
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL record an incoming supplier order, apply its stock reductions
      and shipped quantities, and publish its invoice as one unit of work. GIVEN any
      of these steps fails with an error WHEN the order message is processed THEN the
      work SHALL be undone and the message SHALL be redelivered for another attempt.
    plain_text: >
      Receiving an order, taking stock and sending the invoice either all happen or
      none do; if something fails the order message is tried again.
    technical_note: >
      ejb-jar.xml declares onMessage and processPO with trans-attribute Required under
      container-managed transactions; onMessage wraps every checked exception in an
      EJBException, which rolls back the container transaction. Redelivery semantics
      depend on the JMS provider (not configured in this shard). Note the invoice is
      published on a non-transacted topic session, so the publish itself may not be
      part of the rollback.
    interface: false
    confidence: medium
    confidence_basis: >
      Transaction attributes are declarative and the exception wrapping is visible,
      but redelivery and whether the topic publish joins the transaction depend on
      container/provider behaviour not visible here.
    risk_class: operational
    basis: >
      Required on onMessage and processPO; all caught exceptions in onMessage are
      rethrown as EJBException.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/ejb-jar.xml
        line_start: 317
        line_end: 326
        excerpt: |
              <container-transaction>
                <method>
