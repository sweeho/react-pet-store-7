  - record_key: FUL-BR-0006
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL produce, for each fulfilment attempt that ships at least one
      line, one invoice that carries the order id, the original order date, a
      shipping date equal to the time of the attempt, a fixed addressee of
      "Dear PetStore Customer", and, for each line shipped in THIS attempt only, its
      category, product, item, line number, quantity and unit price.
    plain_text: >
      Each shipment produces its own invoice listing only the lines shipped that time,
      dated today, with the order's id and order date. The customer name on it is
      always the generic "Dear PetStore Customer".
    technical_note: >
      OrderFulfillmentFacadeEJB.createInvoice builds a TPAInvoiceXDE document; it
      iterates all line items but adds only those whose itemId is in the map filled
      by processAnOrder for this attempt. The map is keyed by itemId, so two lines of
      the same item are both included if either shipped.
    interface: true
    confidence: medium
    confidence_basis: >
      Read in one method; invoice XML schema is in a shared component outside this
      shard, so field names are taken from the setter calls only.
    risk_class: financial
    basis: >
      setOrderId, setUserId("Dear PetStore Customer"), setOrderDate(poDate),
      setShippingDate(new Date()) and addLineItem for items in newLis.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 145
        line_end: 166
        excerpt: |
            private String createInvoice(SupplierOrderLocal po, HashMap newLis)
              throws XMLDocumentException {
                invoiceXDE.newDocument();
                invoiceXDE.setOrderId(po.getPoId());
                invoiceXDE.setUserId("Dear PetStore Customer");
                Date poDate = new Date(po.getPoDate());
                invoiceXDE.setOrderDate(poDate);
                Date curDate = new Date();
                invoiceXDE.setShippingDate(curDate);
                Collection items = po.getLineItems();
                Iterator it = items.iterator();
                while((it != null) && (it.hasNext())) {
                  LineItemLocal anItem = (LineItemLocal)it.next();
                  if(newLis.containsKey(anItem.getItemId())) {
                    invoiceXDE.addLineItem(anItem.getCategoryId(),
                                           anItem.getProductId(),
                                           anItem.getItemId(),
                                           anItem.getLineNumber(),
                                           anItem.getQuantity(),
                                           anItem.getUnitPrice());
                  }
                }//end while
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB

