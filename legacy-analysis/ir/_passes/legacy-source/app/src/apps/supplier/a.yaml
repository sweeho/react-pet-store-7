  - record_key: FUL-BR-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL set a supplier order's status to COMPLETED when, during a
      fulfilment attempt, no remaining unshipped line was short of stock. GIVEN at
      least one line could not be shipped WHEN the attempt ends THEN the order status
      SHALL remain unchanged (pending) so a later attempt picks it up.
    plain_text: >
      A supplier order is marked completed once every line has been shipped. If any
      line is still waiting for stock, the order stays pending.
    technical_note: >
      processAnOrder keeps allItemsAvailable=true unless checkInventory fails for some
      unshipped line, then calls po.setPoStatus(OrderStatusNames.COMPLETED). Lines
      already shipped are skipped and do not clear the flag.
    interface: false
    confidence: high
    confidence_basis: >
      Enforced in code and stated in the user guide status table (COMPLETED = all
      lines shipped and invoiced); the guide's table is for the OPC order, but it
      matches the supplier-side rule.
    risk_class: operational
    basis: >
      Status is set to COMPLETED only when allItemsAvailable is still true after the
      loop over lines.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 197
        line_end: 198
        excerpt: |
                if(allItemsAvailable)
                  po.setPoStatus(OrderStatusNames.COMPLETED);
      - kind: document
        path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
