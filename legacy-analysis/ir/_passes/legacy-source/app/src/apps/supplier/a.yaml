findings:
  - kind: ambiguity
    path: legacy-source/app/src/apps/supplier/src/ejb-jar.xml
    description: >
      Every env-entry value in this module is redacted (ejb-jar.xml lines 98, 148,
      153, 158, 163; web.xml line 122): the transition delegate class name, the
      supplier-order DTD/XSD validation switches, the invoice XSD validation switch
      and the supplier order schema id. Whether incoming orders and outgoing
      invoices are schema-validated, and which delegate publishes invoices
      (assumed SupplierOrderTD, the only implementation in the module), cannot be
      read. A human with the unredacted descriptors needs to confirm the values.
  - kind: ambiguity
    path: legacy-source/app/src/apps/supplier/src/docroot/displayinventory.jsp
    description: >
      The inventory screen's not-authorised message reads "You are not authorised to
      update the status of orders", which describes order status, not inventory. It
      is unclear whether this copy is intended (copied from the admin module) or
      should be reworded in the rebuild. Business owner to decide the wording.

suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [FUL-BR-0002, FUL-BR-0004, FUL-BR-0006]
    severity: high
    category: error-swallowed
    title: Invoice failure is swallowed after stock was taken and lines marked shipped
    description: >
      processAnOrder reduces stock, sets each line's shipped quantity and may set the
      order to COMPLETED before it builds the invoice. If building the invoice fails,
      the error is printed and null is returned, so no exception rolls the work back.
      The order is saved as shipped (and possibly completed) with no invoice ever
      sent; later retries skip the shipped lines, so the invoice is never produced.
      The comment claims the order "can be fullfilled later", which the shipped
      quantities prevent.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 193
        line_end: 207
  - capability_key: inventory-management
    record_keys: [INV-WF-0005, FUL-INT-0007]
    severity: high
    category: error-swallowed
    title: Invoice publish failure after an inventory update is swallowed and the update still commits
    description: >
      sendInvoices catches the lookup and publish errors and only prints them. The
      surrounding transaction then commits the stock changes and the shipped
      quantities / COMPLETED status of re-processed orders, so the order processing
      center never receives those invoices.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 139
        line_end: 157
  - capability_key: inventory-management
    record_keys: [INV-BR-0003, INV-WF-0005]
    severity: medium
    category: error-swallowed
    title: Inventory update errors are printed and ignored; partial updates commit and no page is shown
    description: >
      updateInventory catches FinderException outside the loop, so an unknown item id
      stops processing the remaining rows while earlier rows stay changed, and the
      transaction still commits. In doPost every transaction error is caught and only
      printed: the transaction may be left un-rolled-back and the user gets no
      response page.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
