# SX-0001 extract-a, shard legacy-source/app/src/apps/supplier
records:

  - record_key: FUL-WF-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL, on receiving a supplier purchase order message, record the
      order, immediately attempt to ship it from stock, and, WHEN at least one line
      was shipped by that attempt, send an invoice for the shipped lines back to the
      order processing center; WHEN nothing could be shipped, the order SHALL be kept
      for a later attempt and no invoice SHALL be sent.
    plain_text: >
      When the supplier receives an approved order it saves it, ships whatever it has
      in stock straight away and invoices the order centre for what it shipped. If
      nothing could be shipped, the order waits until stock arrives.
    technical_note: >
      SupplierOrderMDB listens on jms/supplier/PurchaseOrderQueue; onMessage calls
      OrderFulfillmentFacadeEJB.processPO, which parses the XML into a SupplierOrder,
      creates the SupplierOrder CMP entity (initial status PENDING is set in the
      supplierpo component, outside this shard) and runs processAnOrder. A non-null
      invoice string is passed to the transition delegate, which publishes it.
    interface: true
    confidence: high
    confidence_basis: >
      The flow is visible end to end in two classes (MDB and facade), the queue
      binding is declared in the deployment descriptor, and the user guide describes
      the supplier as fulfilling OPC orders and invoicing the OPC. Not high on the
      "kept for a later attempt" part alone, which relies on the PENDING status set
      in another component, but the overall workflow is enforced in several places.
    risk_class: operational
    basis: >
      onMessage calls doWork (processPO) and only calls doTransition when the
      returned invoice is not null; the comment says otherwise it waits for inventory.
      processPO persists the order then fulfils it.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 113
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();

              // Do processing work on received message
              String invoice = doWork(recdText);

              // If orders were shipped, do the transition
              if(invoice!=null) {
                doTransition(invoice);
              } //else wait for the inventory to arrive at the inventory receiver
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;

            // Convert Po in XML to PO as Java Obj
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            //persist order
            order = supplierOrderLocalHome.create(supplierOrder);
            //fullfil order
            invoiceXml = processAnOrder(order);
            return invoiceXml;
          }
      - path: legacy-source/app/src/apps/supplier/src/sun-j2ee-ri.xml
        line_start: 310
        line_end: 311
        excerpt: |
                <ejb-name>SupplierOrderMDB</ejb-name>
                <jndi-name>jms/supplier/PurchaseOrderQueue</jndi-name>
      - kind: document
        path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 1. The demo at a glance (Supplier row)"
        excerpt: |
          SupplierStock clerk. Fulfils OPC orders from inventory
          and invoices the OPC
    stack_metadata:
      framework: j2ee-1.3
      ejb.bean: SupplierOrderMDB, OrderFulfillmentFacadeEJB
      ejb.transaction: Required
      jms.queue: jms/supplier/PurchaseOrderQueue

  - record_key: FUL-BR-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL ship an order line only when the stock on hand for its item is
      at least the full line quantity, and SHALL then reduce the stock by the line
      quantity and record the whole line quantity as shipped. GIVEN stock lower than
      the line quantity WHEN the order is processed THEN the line SHALL ship nothing
      (no part-quantity shipment) and stock SHALL be unchanged, while other lines of
      the same order that are in stock SHALL still ship.
    plain_text: >
      A line is shipped only if the whole quantity is in stock; there is no shipping
      part of a line. Other lines of the same order still ship if they are in stock,
      so an order can be partly shipped line by line.
    technical_note: >
      OrderFulfillmentFacadeEJB.checkInventory compares InventoryLocal.getQuantity()
      with the line quantity and calls reduceQuantity on success; processAnOrder then
      sets quantityShipped = quantity and marks the item in the invoice map.
      InventoryEJB.reduceQuantity subtracts with no lower-bound check of its own.
    interface: false
    confidence: high
    confidence_basis: >
      The comparison, the stock decrement and the shipped-quantity update are read
      directly in the facade and the entity; the discovery report and capability
      list both describe partial shipments. Behaviour is unambiguous in code.
    risk_class: operational
    basis: >
      checkInventory returns false when inventory quantity < line quantity, otherwise
      reduces it; processAnOrder continues to the next line on false and sets
      quantityShipped to the full quantity on true.
    traces:
      - path: legacy-source/app/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 131
        excerpt: |
