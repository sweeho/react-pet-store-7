  - record_key: CART-BR-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN a shopper updates the cart WHEN a quantity entered is not a whole number THEN the system
      SHALL treat that line's quantity as 0.
    plain_text: >
      A quantity that is not a number is treated as zero.
    technical_note: >
      CartHTMLAction catches NumberFormatException on new Integer(value) and puts 0. What the cart
      component then does with 0 (remove the line or keep it) is decided in components/cart.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear place in code; no document or test states the rule.
    risk_class: financial
    basis: >
      Quantity parsing fallback.
    traces:
