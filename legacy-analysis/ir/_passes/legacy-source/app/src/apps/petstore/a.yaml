# SX-0001 extract-a — legacy-source/app/src/apps/petstore (storefront web + EJB tier, populate tool)
# Pass A. Sources read: web.xml, signon-config.xml, mappings.xml, screendefinitions_*.xml,
# ejb-jar.xml (trans attrs only; env-entry values redacted), every Java class under
# com/sun/j2ee/blueprints/petstore, every en_US JSP, the ja/zh JSPs for option lists, locale and
# price/cache tags, PopulateSQL.xml, CatalogDAOSQL.xml, Populate-UTF8.xml (users/categories only),
# and legacy-analysis/sources/pdf/petstore-user-guide/extracted.md.
records:

  # ---------------------------------------------------------------- catalog-browsing
  - record_key: CAT-SCR-0001
    kind: screen
    capability_key: catalog-browsing
    requirement: >
      The system SHALL let a visitor navigate category -> product list -> item list -> item detail,
      and SHALL show product and item lists 2 rows at a time, starting at the first row whenever
      a list is opened without paging parameters, with Previous and Next links shown only when an
      earlier or later page exists.
    plain_text: >
      Shoppers pick a category, then a product, then an item. Lists show two entries per page with
      Previous and Next links.
    technical_note: >
      category.jsp and product.jsp set catalog start=0,count=2 when no count parameter is present
      and render Previous/Next from the page-list result (previousPageAvailable/nextPageAvailable).
      Previous always sends count=2; Next sends count=${pageResults.size}. search.jsp uses the same
      pattern. Identical defaults in ja/ and zh/ copies.
    interface: false
    confidence: high
    confidence_basis: >
      The 2-row default and paging links are coded identically in category, product and search
      pages in all three locale copies, and the user guide states "Lists show 2 rows at a time with
      Next and Previous".
    risk_class: presentational
    basis: >
      Page-list defaults and Previous/Next conditions in the category and product JSPs; user guide
      section 2.2.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/category.jsp
        line_start: 65
        line_end: 77
        excerpt: |
          <c:choose>
           <c:when test="${param.count != null}">
            <c:set value="${param.start}" target="${catalog}" property="start"/>
            <c:set value="${param.count}" target="${catalog}" property="count"/>
           </c:when>
           <c:otherwise>
            <c:set value="0" target="${catalog}" property="start"/>
            <c:set value="2" target="${catalog}" property="count"/>
           </c:otherwise>
          </c:choose>
          <c:set value="en_US" target="${catalog}" property="locale"/>
          <c:set value="${param.category_id}" target="${catalog}" property="categoryId"/>
          <c:set value="${catalog.products}" var="pageResults" />
      - path: legacy-source/app/src/apps/petstore/src/docroot/product.jsp
        line_start: 130
        line_end: 149
        excerpt: |
          <c:if test="${pageResults.previousPageAvailable == true}">
          ...
          <c:if test="${pageResults.nextPageAvailable == true}">
      - kind: document
        path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 2.2 Browsing and searching"
        excerpt: |
          Select a category to list its products, a product to list its items, and an item to see its detail. Lists show 2
          rows at a time with Next and Previous.
    stack_metadata:
      jsp.page: [category.jsp, product.jsp, item.jsp]
      framework: WAF template screens

  - record_key: CAT-SCR-0002
    kind: screen
    capability_key: catalog-browsing
    requirement: >
      The item detail screen SHALL show the item's name and attribute, its image, a "List Price"
      taken from the item's list price and a "Your Price" taken from the item's unit cost, both
      formatted as currency for the page's locale, and an Add to Cart link for that item.
    plain_text: >
      The item page shows two prices: the list price and "Your Price", plus an Add to Cart link.
    technical_note: >
      item.jsp renders ${item.listCost} as List Price and ${item.unitCost} as Your Price with
      fmt:formatNumber type=currency under fmt:setLocale en_US (ja_JP / zh_CN in the locale copies).
      unitCost is the same value the cart charges (see CHK-BR-0004).
    interface: false
    confidence: high
    confidence_basis: >
      Same two-price rendering in en, ja and zh item pages, and the user guide describes both prices.
      What "Your Price" means commercially is disputed separately on CHK-BR-0004.
    risk_class: financial
    basis: >
      item.jsp price rendering; user guide 2.3.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/item.jsp
        line_start: 66
        line_end: 78
        excerpt: |
          <td class="petstore" width="100%"><b>List Price:</b>
           <fmt:formatNumber value="${item.listCost}" type="currency" />
           <br><br>
           <b>Your Price:</b>
           <fmt:formatNumber value="${item.unitCost}" type="currency" />
      - path: legacy-source/app/src/apps/petstore/src/docroot/ja/item.jsp
        line_start: 71
        line_end: 74
        excerpt: |
          <fmt:formatNumber value="${item.listCost}" type="currency" />
          <fmt:formatNumber value="${item.unitCost}" type="currency" />
      - kind: document
        path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 2.3 Item prices"
        excerpt: |
          List Price: the shelf price of the item.
          Your Price: the discounted price for members.
    stack_metadata:
      jsp.page: item.jsp

  - record_key: CAT-BR-0003
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The product's item list SHALL show each item's list price, while keyword search results
      SHALL show each item's unit cost ("Your Price") and the cart SHALL show the unit cost.
    plain_text: >
      The item list under a product shows the list price; search results and the cart show the
      member price.
    technical_note: >
      product.jsp:107 formats item.listCost; search.jsp:116 and cart.jsp:85 format item.unitCost.
      Same in ja/ and zh/ copies.
    interface: false
    confidence: medium
    confidence_basis: >
      Read directly in three pages and consistent across locales, but no document says which price
      each list should show, so the intent behind the difference cannot be confirmed.
    risk_class: presentational
    basis: >
      Price field used per listing page.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/product.jsp
        line_start: 107
        line_end: 107
        excerpt: |
          <fmt:formatNumber value="${item.listCost}" type="currency" />
      - path: legacy-source/app/src/apps/petstore/src/docroot/search.jsp
        line_start: 116
        line_end: 116
        excerpt: |
          <fmt:formatNumber value="${item.unitCost}" type="currency" />
    stack_metadata:
      jsp.page: [product.jsp, search.jsp]

  - record_key: CAT-BR-0004
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL split the search text on whitespace into keywords and SHALL return the items,
      in the shopper's current locale, whose product name, category id or item description contains
      ANY of the keywords. GIVEN the search text is empty or nothing matches WHEN the search runs
      THEN the page SHALL show "No results were found for your search."
    plain_text: >
      Search looks for any of the typed words in the product name, the category or the item
      description, in the shopper's language. No match shows a "no results" message.
    technical_note: >
      Search SQL (SEARCH_ITEMS in docroot/CatalogDAOSQL.xml) compares lower(name), lower(catid),
      lower(b.descn) with LIKE per keyword, OR-ed, filtered on locale. Tokenising and binding happen
      in the catalog component DAO. GenericCatalogDAO binds "%"+keyword+"%" without lower-casing
      the keyword; CloudscapeCatalogDAO lower-cases it. Which DAO is live depends on the redacted
      env-entry param/CatalogDAOClass (web.xml:194).
    interface: false
    confidence: medium
    confidence_basis: >
      The any-word, three-field, per-locale match is stated in the SQL and the user guide. Case
      handling is not: it depends on which DAO is deployed, and that setting is redacted.
    dispute:
      reason: contradicts-docs
      detail: >
        The user guide says "Search is not case-sensitive". The SQL lower-cases the columns only.
        GenericCatalogDAO does not lower-case the keyword, so "Dog" would match nothing, while
        CloudscapeCatalogDAO does. Settle by recovering the value of param/CatalogDAOClass in
        web.xml (redacted) or by running a mixed-case search against the live system.
    risk_class: operational
    basis: >
      SEARCH_ITEMS statement; search.jsp no-result condition; user guide 2.2.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 112
        line_end: 126
        excerpt: |
          <SQLStatement method="SEARCH_ITEMS">
              <SQLFragment parameterNb="4">
              ...
                  where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
              </SQLFragment>
              <SQLFragment parameterNb="3" occurrence="VARIABLE">
                  or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
              </SQLFragment>
      - path: legacy-source/app/src/apps/petstore/src/docroot/search.jsp
        line_start: 75
        line_end: 82
        excerpt: |
          <c:set value="${param.keywords}" target="${catalog}" property="searchQuery"/>
          <c:set value="${catalog.searchItems}" var="pageResults" />
          <c:choose>
           <c:when test="${param.keywords == '' || pageResults.size == 0}">
            <p class="petstore_title">
              No results were found for your search.
      - path: legacy-source/app/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 346
        line_end: 364
        excerpt: |
          StringTokenizer tokenizer = new StringTokenizer(searchQuery);
          ...
          parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
      - kind: document
        path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 2.2 Browsing and searching"
        excerpt: |
          Search is not case-sensitive. It matches the product name, the category and the item
          description, and shows items that match any of the words.
    stack_metadata:
      jsp.page: search.jsp
      db.object: SEARCH_ITEMS

  - record_key: CAT-BR-0005
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL serve every storefront page in English (en_US), Japanese (ja_JP) or Chinese
      (zh_CN), SHALL default to en_US, and SHALL show catalog names, descriptions and prices from the
      catalog content of the page's locale.
    plain_text: >
      The store is available in English, Japanese and Chinese; English is the default, and catalog
      text and prices come from the matching language version.
    technical_note: >
      web.xml TemplateServlet init-param locales=en_US,ja_JP,zh_CN, default_locale=en_US; the en
      JSPs set catalog locale en_US, ja/ copies ja_JP, zh/ copies zh_CN. Catalog detail tables are
      keyed (id, locale).
    interface: false
    confidence: high
    confidence_basis: >
      Declared in web.xml and repeated by every catalog JSP copy; the user guide lists the same three
      languages.
    risk_class: presentational
    basis: >
      Template servlet locale list and per-locale JSP locale settings.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 108
        line_end: 115
        excerpt: |
          <init-param>
            <param-name>locales</param-name>
            <param-value>en_US,ja_JP,zh_CN</param-value>
          </init-param>
          <init-param>
            <param-name>default_locale</param-name>
            <param-value>en_US</param-value>
      - path: legacy-source/app/src/apps/petstore/src/docroot/zh/item.jsp
        line_start: 55
        line_end: 55
        excerpt: |
          <c:set value="zh_CN" target="${catalog}" property="locale"/>
      - kind: document
        path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1 / 2.1 Visiting the Storefront"
        excerpt: |
          The page is available in English, Japanese and Chinese. The language
          follows the browser setting and can be changed on the page.
    stack_metadata:
      framework: WAF TemplateServlet

  - record_key: CAT-BR-0006
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL let a shopper switch the storefront language to English, Japanese or Chinese
      from any page, and SHALL apply the chosen language to the shopper's cart as well.
    plain_text: >
      Flag links on every page change the language, and the cart follows the new language.
    technical_note: >
      banner.jsp renders three client_cache_link flags to changelocale.do with locale en_US/ja_JP/
      zh_CN. ChangeLocaleEJBAction stores the locale on the state machine and calls
      cart.setLocale(locale).
    interface: false
    confidence: high
    confidence_basis: >
      Two places: the banner links and the EJB action that applies the locale to the cart; the user
      guide says the language can be changed on the page.
    risk_class: presentational
    basis: >
      Banner language links and locale-change action.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/banner.jsp
        line_start: 76
        line_end: 105
        excerpt: |
          <waf:client_cache_link   id="petstore"
                                  targetURL="changelocale.do"
          ...
            <waf:param name="locale" value="en_US"/>
          ...
          <waf:param name="locale" value="ja_JP"/>
          ...
          <waf:param name="locale" value="zh_CN"/>
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/ChangeLocaleEJBAction.java
        line_start: 59
        line_end: 67
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              ChangeLocaleEvent ce = (ChangeLocaleEvent)e;
              machine.setAttribute(PetstoreKeys.LOCALE, ce.getLocale());
              // notify the shopping cart of the locale change
              ShoppingClientFacadeLocal scf = null;
              scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
              ShoppingCartLocal cart = scf.getShoppingCart();
              cart.setLocale(ce.getLocale());
              return null;
    stack_metadata:
      struts.action: changelocale.do
      ejb.bean: ShoppingControllerEJB

  - record_key: CAT-BR-0007
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
