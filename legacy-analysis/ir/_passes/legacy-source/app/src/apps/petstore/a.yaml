  - record_key: CAT-BR-0008
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL cache the rendered category navigation and product item lists for 5 minutes
      per page and request parameters, shared by all visitors, so catalog changes MAY take up to 5
      minutes to appear on those pages.
    plain_text: >
      Some catalog pages are cached for five minutes, so catalog changes can take up to five minutes
      to show.
    technical_note: >
      waf:cache scope=context duration=300000 on product.jsp (all locales), sidebar.jsp (all
      locales) and en category.jsp only; the ja/zh category.jsp copies have no cache tag. The cache
      key includes the request URI, the cache name and the query string (waf CacheTag).
    interface: false
    confidence: medium
    confidence_basis: >
      The duration literal is read directly in several pages, but the coverage differs between
      locales (en category cached, ja/zh not), so the intended rule is unclear.
    risk_class: operational
    basis: >
      waf:cache tags on catalog pages.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/docroot/product.jsp
        line_start: 48
        line_end: 48
        excerpt: |
          <waf:cache name="product_en_US" scope="context" duration="300000">
      - path: legacy-source/app/src/apps/petstore/src/docroot/category.jsp
        line_start: 47
        line_end: 47
        excerpt: |
          <waf:cache name="page" scope="context" duration="300000">
      - path: legacy-source/app/src/apps/petstore/src/docroot/sidebar.jsp
        line_start: 48
        line_end: 48
        excerpt: |
          <waf:cache name="sidebar_en_US" scope="context" duration="300000">
    stack_metadata:
      jsp.page: [product.jsp, category.jsp, sidebar.jsp]

