      ejb.bean: ShoppingClientFacadeEJB

  # ---------------------------------------------------------------- customer-accounts
  - record_key: ACCT-WF-0001
    kind: workflow
    capability_key: customer-accounts
    requirement: >
      The system SHALL let a new visitor sign up by entering a user name, a password and the password
      repeated, SHALL create the sign-on user, and SHALL then show the customer details form.
      GIVEN the user name is already taken (or the user cannot be created) WHEN the visitor submits
      THEN the system SHALL show "The User name you have chosen is in use. Please choose another
      username."
    plain_text: >
      New customers choose a user name and password, then fill in their account details. A taken
      user name gives an "in use" message.
    technical_note: >
      signon.jsp form "newcustomer" posts j_username, j_password, j_password_2 to createuser.do.
      CreateUserHTMLAction builds CreateUserEvent(userName,password) (password lines redacted);
      CreateUserEJBAction calls SignOnLocal.createUser and maps CreateException to
      DuplicateAccountException, which mappings.xml routes to duplicate_account.screen. Success
      goes to create_customer.screen.
    interface: false
    confidence: high
    confidence_basis: >
      Form, web action, EJB action, exception mapping and error page all agree; the user guide
      describes the same sign-up steps.
    risk_class: regulated
    basis: >
      Sign-up form, create-user actions, duplicate account mapping.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CreateUserEJBAction.java
        line_start: 93
        line_end: 101
        excerpt: |
