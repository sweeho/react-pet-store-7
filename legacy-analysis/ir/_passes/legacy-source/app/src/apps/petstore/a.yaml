findings:
  - kind: unparseable
    path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
    description: >
      Lines 53-56 map SignOffEvent to SignOffEJBAction in the petstore package, but neither class
      exists in the tree. Sign-off works through SignOffHTMLAction, which returns a
      ChangeLocaleEvent, so this mapping looks dead. Reachability is unresolved: a human should
      confirm whether any deployed build ships these classes. No record was emitted for it.
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
    description: >
      Line 112 routes GeneralFailureException to "error.screen", but the screen definitions only
      define "general_error" (screendefinitions_en_US.xml:202). What a shopper sees on a general
      failure cannot be settled from the source. Needs a run against the live system.
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/screendefinitions_en_US.xml
    description: >
      Screen "signon_create" (lines 178-184) uses /create_user.jsp, which does not exist in docroot.
      No mapping or link to signon_create.screen was found. It may be a dead screen.
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CreateUserHTMLAction.java
    description: >
      Lines 77-78 (password and repeated password) and the sign-on component's maximum password
      length are redacted («REDACTED:secret-finding-25/26»). Password rules (length, the repeat
      check) cannot be extracted. ejb-jar.xml env-entries for the event-to-action map (lines 57-90)
      and web.xml's param/CatalogDAOClass and param/CatalogDAODatabase (lines 184-197) are also
      redacted.
  - kind: ambiguity
    path: legacy-source/app/src/apps/petstore/src/docroot/ja/category.jsp
    description: >
      Locale drift: the en_US category page is cached for 5 minutes, but the ja and zh copies have
      no cache tag. A human should decide whether caching is a requirement or an incidental choice
      (see CAT-BR-0008).

