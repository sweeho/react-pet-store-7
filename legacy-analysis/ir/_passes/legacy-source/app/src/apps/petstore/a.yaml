  - record_key: CART-BR-0004
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL give every visitor session its own cart from the start of the session, without
      sign-on, and SHALL keep that cart for the life of the session.
    plain_text: >
      Visitors get a cart as soon as they arrive and can shop without signing in.
    technical_note: >
      PetstoreComponentManager.sessionCreated puts the session's ShoppingCartLocal (stateful, via
      ShoppingClientFacadeLocalEJB.getShoppingCart) in session attribute "cart"; cart.do is not a
      protected resource in signon-config.xml.
    interface: false
    confidence: medium
    confidence_basis: >
      Cart creation is one clear place; anonymous access is inferred from the absence of cart.do in
      the protected list rather than a positive statement.
    risk_class: operational
    basis: >
      Session listener creating the cart; protected resource list.
    traces:
      - path: legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/PetstoreComponentManager.java
        line_start: 105
        line_end: 108
        excerpt: |
          public void sessionCreated(HttpSessionEvent se) {
              super.sessionCreated(se);
              se.getSession().setAttribute(PetstoreKeys.CART, getShoppingCart(se.getSession()));
          }
    stack_metadata:
