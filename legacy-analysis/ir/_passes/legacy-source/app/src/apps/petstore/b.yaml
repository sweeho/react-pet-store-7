  - record_key: "ACCT-BR-0003"
    kind: "business-rule"
    capability_key: "customer-accounts"
    requirement: "The system SHALL treat last name, first name, street address, city, state or province, postal code and telephone as required contact fields, and street address line 2 and e-mail as optional, when an account is created or updated. GIVEN a required contact field is blank WHEN the form is submitted THEN the system records the missing fields but does not show them to the customer and does not stop the request (see suspected defect)."
    plain_text: "Name, street, city, state, postal code and phone are meant to be required on the account form; address line 2 and e-mail are optional. Today a blank required field is noticed but the customer is not told."
    technical_note: "CustomerHTMLAction.extractContactInfo collects missing field names into a list, stores a MissingFormDataException in a request attribute and returns null ContactInfo; nothing in the code base reads that attribute, and the event is still sent. Card and profile extraction also build missing-field lists that are discarded. Blank address_2 is stored as null."
    interface: false
    confidence: "medium"
    confidence_basis: "The required set is clear in one method (duplicated in OrderHTMLAction for checkout); what the customer experiences when a field is blank could not be confirmed, because the null ContactInfo fails later outside this method."
    risk_class: "operational"
    basis: "Field-by-field blank checks in the account form handler."
    traces:
      - path: "legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java"
        line_start: 182
        line_end: 253
        excerpt: "    private ContactInfo extractContactInfo(HttpServletRequest request, String suffix)\n        throws HTMLActionException {\n        ArrayList missingFields = null;\n        String familyName =  request.getParameter(\"family_name\" +suffix).trim();\n        if (familyName.equals(\"\")) {\n            if (missingFields == null) {\n                missingFields = new ArrayList();\n            }\n            missingFields.add(\"Last Name\");\n        }\n        String givenName =  request.getParameter(\"given_name\" +suffix).trim();\n        if (givenName.equals(\"\")) {\n            if (missingFields == null) {\n                missingFields = new ArrayList();\n            }\n            missingFields.add(\"First Name\");\n        }\n        String address1 = request.getParameter(\"address_1\" +suffix).trim();\n        if (address1.equals(\"\")){\n            if (missingFields == null) {\n                missingFields = new ArrayList();\n            }\n            missingFields.add(\"Street Address\");\n        }\n        String address2 = request.getParameter(\"address_2\" +suffix).trim();\n        if (address2.equals(\"\")) {\n          address2 = null;\n        }\n        String city =   request.getParameter(\"city\"  +suffix).trim();\n        if (city.equals(\"\")){\n            if (missingFields == null) {\n                missingFields = new ArrayList();\n            }\n            missingFields.add(\"City\");\n        }\n        String stateOrProvince = request.getParameter(\"state_or_province\" +suffix).trim();\n        if (stateOrProvince.equals(\"\")) {\n            if (missingFields == null) {\n                missingFields = new ArrayList();\n            }\n            missingFields.add(\"State or Province\" +suffix);\n        }\n        String postalCode = request.getParameter(\"postal_code\" +suffix).trim();\n        if (postalCode.equals(\"\")){\n            if (missingFields == null) {\n                missingFields = new ArrayList();\n            }\n            missingFields.add(\"Postal Code\");\n        }\n\n        String country = request.getParameter(\"country\" + suffix).trim();\n        String telephone = request.getParameter(\"telephone_number\" +suffix).trim();\n        if (telephone.equals(\"\")){\n            if (missingFields == null) {\n                missingFields = new ArrayList();\n            }\n            missingFields.add(\"Telephone Number\");\n        }\n\n        String email = null;\n        if (request.getParameter(\"email\"  +suffix) != null) {\n            email = request.getParameter(\"email\" +suffix).trim();\n        }\n        if (missingFields != null) {\n            MissingFormDataException ex = new MissingFormDataException(\"Missing Address Data\", missingFields);\n            request.setAttribute(PetstoreKeys.MISSING_FORM_DATA_EXCEPTION_KEY, ex);\n            return null;\n        }\n\n        Address address = new Address(address1, address2, city, stateOrProvince, postalCode, country);\n        return new ContactInfo(familyName, givenName, address, email, telephone);\n    }"
    stack_metadata:
      struts.action: "createcustomer.do, customer.do"
