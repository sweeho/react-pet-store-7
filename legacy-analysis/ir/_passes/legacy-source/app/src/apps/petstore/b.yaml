      - path: "legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/SignOnNotifier.java"
        line_start: 113
        line_end: 143
        excerpt: "        if (name.equals(SignOnFilter.SIGNED_ON_USER)) {\n            boolean aSignOn  = ((Boolean)se.getValue()).booleanValue();\n            if (aSignOn) {\n\n              String userName = (String)session.getAttribute(SignOnFilter.USER_NAME);\n              // look up the model manager and webclient controller\n              PetstoreComponentManager sl = (PetstoreComponentManager)session.getAttribute(PetstoreKeys.COMPONENT_MANAGER);\n              WebController wc =  sl.getWebController(session);\n              SignOnEvent soe = new SignOnEvent(userName);\n              // set the EJBAction on the Event\n              EventMapping em = getEventMapping(session.getServletContext(), soe);\n              if (em != null) {\n                  soe.setEJBActionClassName(em.getEJBActionClassName());\n              }\n\n              try {\n                  wc.handleEvent(soe, session);\n              } catch (EventException e) {\n                  System.err.println(\"SignOnNotifier Error handling event \" + e);\n              }\n              CustomerLocal customer =  sl.getCustomer(session);\n              // ensure the customer object is put in the session\n              if (session.getAttribute(PetstoreKeys.CUSTOMER) == null) {\n                session.setAttribute(PetstoreKeys.CUSTOMER, customer);\n              }\n              // set the language to the preferred language and other preferences\n              ProfileLocal profile = sl.getCustomer(session).getProfile();\n              Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());\n              session.setAttribute(PetstoreKeys.LOCALE, locale);\n            }\n        }"
      - path: "legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java"
        line_start: 77
        line_end: 97
        excerpt: "    public EventResponse perform(Event e) throws EventException {\n        SignOnEvent cue = (SignOnEvent)e;\n        String userId = cue.getUserName();\n        // put a copy of the userName in the shopping client facade for future retrival\n         ShoppingClientFacadeLocal scf = null;\n         scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);\n         scf.setUserId(userId);\n         // set the locale here to the user's desired locale\n         try {\n             ProfileLocal profile = scf.getCustomer().getProfile();\n             Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());\n             machine.setAttribute(PetstoreKeys.LOCALE, locale);\n              // notify the shopping cart of the locale change\n             ShoppingCartLocal cart = scf.getShoppingCart();\n             cart.setLocale(locale);\n         } catch ( FinderException fe) {\n             // in the process of creating a user for the first time\n             // so the locale will be se when creating the user\n         }\n         return null;\n     }"
