    basis: "Remove-then-create in the populators."
    traces:
      - path: "legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/tools/populate/UserPopulator.java"
        line_start: 98
        line_end: 113
        excerpt: "  private UserLocal createUser(String id, String password) throws PopulateException {\n    try {\n      if (userHome == null) {\n        InitialContext context = new InitialContext();\n        userHome = (UserLocalHome) context.lookup(JNDI_USER_HOME);\n      }\n      UserLocal user;\n      try {\n        user = userHome.findByPrimaryKey(id);\n        user.remove();\n      } catch (Exception exception) {}\n      user = userHome.create(id, password);\n      return user;\n    } catch (Exception exception) {\n      throw new PopulateException (\"Could not create: \" + exception.getMessage(), exception);\n    }"
      - path: "legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/tools/populate/CustomerPopulator.java"
        line_start: 101
        line_end: 130
        excerpt: "  private CustomerLocal createCustomer(String id, AccountLocal account, ProfileLocal profile) throws PopulateException {\n    try {\n      if (customerHome == null) {\n        InitialContext context = new InitialContext();\n        customerHome = (CustomerLocalHome) context.lookup(JNDI_CUSTOMER_HOME);\n      }\n      try {\n        CustomerLocal customer = customerHome.findByPrimaryKey(id);\n        customer.remove();\n      } catch (Exception exception) {}\n      CustomerLocal customer = customerHome.create(id);\n      if (account != null) {\n        AccountLocal acct = customer.getAccount();\n        acct.setStatus(account.getStatus());\n        acct.setContactInfo(account.getContactInfo());\n        acct.setCreditCard(account.getCreditCard());\n        account.remove();\n      }\n      if (profile != null) {\n        ProfileLocal prof = customer.getProfile();\n        prof.setPreferredLanguage(profile.getPreferredLanguage());\n        prof.setFavoriteCategory(profile.getFavoriteCategory());\n        prof.setMyListPreference(profile.getMyListPreference());\n        prof.setBannerPreference(profile.getBannerPreference());\n        profile.remove();\n      }\n      return customer;\n    } catch (Exception exception) {\n      throw new PopulateException (\"Could not create: \" + exception.getMessage(), exception);\n    }"
