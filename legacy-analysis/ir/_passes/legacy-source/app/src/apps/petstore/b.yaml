  - record_key: "CATB-REQ-0007"
    kind: "requirement"
    capability_key: "catalog-browsing"
    requirement: "The system SHALL let the shopper switch the storefront language at any time to English, Japanese or Chinese from a control on every page, and SHALL apply the new language to the shopping cart as well."
    plain_text: "Every page has flags to switch the store to English, Japanese or Chinese; the cart follows the new language."
    technical_note: "banner.jsp renders three waf:client_cache_link flags posting locale=en_US|ja_JP|zh_CN to changelocale.do (mapped in mappings.xml to ChangeLocaleHTMLAction with ClientStateFlowHandler, returning the shopper to the page they were on). ChangeLocaleEJBAction stores the locale in the controller state and calls ShoppingCart.setLocale."
    interface: false
    confidence: "high"
    confidence_basis: "Visible in the banner markup, the URL mapping and the server action; user guide 2.1 says the language can be changed on the page."
    risk_class: "presentational"
    basis: "Language flags on the banner, URL mapping for changelocale.do and the action that propagates locale to the cart."
    traces:
      - path: "legacy-source/app/src/apps/petstore/src/docroot/banner.jsp"
        line_start: 76
        line_end: 105
        excerpt: "       <waf:client_cache_link   id=\"petstore\"\n                              targetURL=\"changelocale.do\"\n                                           alt=\"Change the Language to English\"\n  encodeRequestParameters=\"true\" \n    encodeRequestAttributes=\"true\"\n                               imageURL=\"images/us_flag.gif\">\n        <waf:param name=\"locale\" value=\"en_US\"/>\n       </waf:client_cache_link>\n      </td>\n      <td>&nbsp;</td>\n      <td align=\"middle\">\n      <waf:client_cache_link   id=\"petstore\"\n                              targetURL=\"changelocale.do\"\n                                           alt=\"Change the Language to Japanese\"\n  encodeRequestParameters=\"true\" \n   encodeRequestAttributes=\"true\"\n                              imageURL=\"images/ja_flag.gif\">\n      <waf:param name=\"locale\" value=\"ja_JP\"/>\n      </waf:client_cache_link>\n     </td>\n     <td>&nbsp;</td>\n      <td align=\"right\">\n      <waf:client_cache_link   id=\"petstore\"\n                              targetURL=\"changelocale.do\"\n                                           alt=\"Change the Language to Chinese\"\n  encodeRequestParameters=\"true\" \n   encodeRequestAttributes=\"true\"\n                              imageURL=\"images/zh_flag.gif\">\n      <waf:param name=\"locale\" value=\"zh_CN\"/>\n      </waf:client_cache_link>"
      - path: "legacy-source/app/src/apps/petstore/src/docroot/WEB-INF/mappings.xml"
        line_start: 101
        line_end: 104
        excerpt: "    <url-mapping url=\"changelocale.do\" useFlowHandler=\"true\" >\n        <web-action-class>com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction</web-action-class>\n        <flow-handler class=\"com.sun.j2ee.blueprints.waf.controller.web.flow.handlers.ClientStateFlowHandler\"/>\n   </url-mapping>"
      - path: "legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/ChangeLocaleEJBAction.java"
        line_start: 59
        line_end: 68
        excerpt: "  public EventResponse perform(Event e) throws EventException {\n      ChangeLocaleEvent ce = (ChangeLocaleEvent)e;\n      machine.setAttribute(PetstoreKeys.LOCALE, ce.getLocale());\n      // notify the shopping cart of the locale change\n      ShoppingClientFacadeLocal scf = null;\n      scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);\n      ShoppingCartLocal cart = scf.getShoppingCart();\n      cart.setLocale(ce.getLocale());\n      return null;\n  }"
      - kind: "document"
        path: "legacy-analysis/sources/pdf/petstore-user-guide/extracted.md"
        anchor: "p1 - 2.1 Visiting the Storefront"
        excerpt: "The language"
