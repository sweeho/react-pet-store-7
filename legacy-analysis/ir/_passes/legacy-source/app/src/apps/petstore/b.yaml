  - capability_key: "catalog-data-maintenance"
    record_keys:
      - "DATA-REQ-0001"
    severity: "low"
    category: "error-swallowed"
    title: "Populate check errors are treated as \"not populated\", triggering a drop"
    description: "Any exception during the already-populated check is swallowed and counts as not populated, so a transient failure (for example the customer lookup) leads to the catalog tables being dropped and reloaded. After an error redirect the servlet also falls through to a second redirect."
    traces:
      - path: "legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java"
        line_start: 152
        line_end: 160
        excerpt: "      if (!forcefully) {\n        try {\n          alreadyPopulated = catalogPopulator.check(connection) && customerPopulator.check() && userPopulator.check();\n        } catch (PopulateException exception) {}\n        //System.err.println(\"Already populated: \" + alreadyPopulated);\n      }\n      if (forcefully || !alreadyPopulated) {\n        catalogPopulator.dropTables(connection);\n        catalogPopulator.createTables(connection);"
      - path: "legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java"
        line_start: 119
        line_end: 131
        excerpt: "    } catch(PopulateException exception) {\n      System.err.println(exception.getRootCause().getMessage());\n      if (errorPageURL == null) {\n        throw new ServletException(\"Populate exception occured :\" + exception.getMessage(), exception.getRootCause());\n      } else {\n        redirect(request, response, errorPageURL);\n      }\n    }\n    if (successPageURL != null) {\n      redirect(request, response, successPageURL);\n    } else if (refererURL != null) {\n      redirect(request, response, refererURL);\n    }"
