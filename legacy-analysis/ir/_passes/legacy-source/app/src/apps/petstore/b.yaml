    description: "Cart update turns non-numeric quantities into 0 (lines 111-116) and passes negative numbers through. Whether 0 removes the line and whether negatives are rejected is decided in the cart component (ShoppingCartEJB), outside this shard. Settle it when the cart component is extracted."
  - kind: "ambiguity"
    path: "legacy-source/app/src/apps/petstore/src/docroot/item.jsp"
    description: "The user guide (p1 section 2.3) calls Your Price \"the discounted price for members\", but the storefront shows and charges this price to every shopper whether or not they are signed on (item, search, cart). Checkout requires sign-on, so every buyer is a member in practice. A business owner should confirm that the member-only wording carries no extra rule."
