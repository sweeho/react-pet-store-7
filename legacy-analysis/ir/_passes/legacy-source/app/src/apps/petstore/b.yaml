    kind: "business-rule"
    capability_key: "sign-on"
    requirement: "The system SHALL, when a customer signs on, load that customer's record into the session and switch the storefront and the shopping cart to the customer's preferred language. GIVEN the signed-on user has no customer record yet (first-time sign-up) WHEN sign-on completes THEN the language SHALL be left unchanged until the account is created."
    plain_text: "When a customer signs in, the store switches to their preferred language and remembers who they are."
    technical_note: "SignOnNotifier (HttpSessionAttributeListener) reacts to SIGNED_ON_USER=true, raises SignOnEvent; SignOnEJBAction sets the user id on the facade, reads Profile.preferredLanguage, sets controller locale and cart locale, ignoring FinderException for first-time users. SignOnNotifier then puts the customer in session attribute \"customer\" and sets session locale from the profile."
    interface: false
