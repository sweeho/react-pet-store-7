    description: "User guide p1 sections 2.5 and 3.3 describe the $500 auto-approval threshold (\"less than $500\" is approved automatically, \"greater than $500\" is pending), which leaves an order of exactly $500 undefined. The storefront module computes the total but applies no threshold, so the rule lives in another module (order-approval). Whoever extracts the OPC module should settle the boundary."
