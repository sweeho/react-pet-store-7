  - record_key: "DATA-BR-0004"
    kind: "business-rule"
    capability_key: "catalog-data-maintenance"
    requirement: "The system SHALL end the caller's storefront session before populating data, and SHALL afterwards continue to the supplier application's population step (or the given success page)."
    plain_text: "Loading demo data signs the visitor out and then continues to load the supplier's data."
    technical_note: "PopulateServlet.doPost invalidates the session (\"all EJB Refs are no longer valid\") then redirects to success_page; populating.jsp passes success_page=//supplier/populating.jsp?forcefully=.., an absolute path on the same host, chaining to the supplier application's populate."
    interface: true
    confidence: "medium"
    confidence_basis: "Clear in servlet and page; the supplier side is outside this shard."
    risk_class: "operational"
    basis: "Session invalidation and redirect chain to the supplier populate page."
    traces:
      - path: "legacy-source/app/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java"
        line_start: 110
        line_end: 133
        excerpt: "  public void doPost(HttpServletRequest request, HttpServletResponse response) throws IOException, ServletException {\n    String successPageURL = request.getParameter(SUCCESS_PAGE_URL_PARAM);\n    String errorPageURL = request.getParameter(ERROR_PAGE_URL_PARAM);\n    String forcefully = request.getParameter(FORCEFULLY_MODE_PARAM);\n    String refererURL = request.getHeader(REFERER_HEADER);\n    // kill the Servlet Session because all EJB Refs are no longer valid\n    request.getSession().invalidate();\n    try {\n      populate(forcefully != null && Boolean.valueOf(forcefully).booleanValue());\n    } catch(PopulateException exception) {\n      System.err.println(exception.getRootCause().getMessage());\n      if (errorPageURL == null) {\n        throw new ServletException(\"Populate exception occured :\" + exception.getMessage(), exception.getRootCause());\n      } else {\n        redirect(request, response, errorPageURL);\n      }\n    }\n    if (successPageURL != null) {\n      redirect(request, response, successPageURL);\n    } else if (refererURL != null) {\n      redirect(request, response, refererURL);\n    }\n    return;\n  }"
      - path: "legacy-source/app/src/apps/petstore/src/docroot/populating.jsp"
        line_start: 47
        line_end: 47
        excerpt: "<META HTTP-EQUIV=REFRESH CONTENT=\"0; URL=Populate?success_page=//supplier/populating.jsp%3fforcefully%3d<%=request.getParameter(\"forcefully\") %>&forcefully=<%=request.getParameter(\"forcefully\") %>\""
    stack_metadata:
      batch.trigger: "HTTP redirect chain"
