  - record_key: "OAP-RULE-0003"
    kind: "business-rule"
    capability_key: "order-approval"
    requirement: "The system SHALL apply an approval or denial only to an order whose current status is PENDING. GIVEN an order in a batch of approval decisions is already APPROVED, DENIED, SHIPPED_PART or COMPLETED WHEN the batch is processed THEN that order SHALL be skipped silently: its status SHALL NOT change, no supplier order SHALL be sent and no customer notification SHALL be produced for it."
    plain_text: "Once an order has been approved or denied, a later approve/deny decision for it is ignored, and the customer gets no second e-mail."
    technical_note: "OrderApprovalMDB.doWork reads ProcessManager.getStatus(orderId) for every ChangedOrder and 'continue's unless it equals OrderStatusNames.PENDING. This also makes redelivered or duplicate approval messages idempotent. No error or log is produced for a skipped order."
    confidence: "medium"
    confidence_basis: "One clear guard in OrderApprovalMDB with an explanatory comment; no second enforcement point (for example a status constraint) is visible in this module."
    risk_class: "financial"
    basis: "Status guard and comment in OrderApprovalMDB.doWork."
    traces:
      - path: "legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java"
        line_start: 200
        line_end: 207
        excerpt: "      ChangedOrder co = (ChangedOrder) it.next();\n      // only PENDING orders can be updated\n      //if order alreay APPROVED or DENIED or COMPLETED, then order\n      //already processed so dont process again\n      String curStatus = processManager.getStatus(co.getOrderId());\n      if(!curStatus.equals(OrderStatusNames.PENDING)) {\n        continue;\n      }\n"
