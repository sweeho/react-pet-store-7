  - record_key: "OAP-RULE-0001"
    kind: "business-rule"
    capability_key: "order-approval"
    requirement: "The system SHALL automatically approve a new order only when (a) the order locale is en_US and the order total is strictly less than 500, or (b) the order locale is ja_JP and the order total is strictly less than 50000. GIVEN any other locale (including zh_CN) WHEN an order is received THEN it SHALL remain PENDING for an administrator regardless of its total. GIVEN an en_US order of exactly 500 WHEN it is received THEN it SHALL remain PENDING."
    plain_text: "Small orders are approved automatically: US orders under 500 dollars and Japanese orders under 50 000 yen. Every other order, including all Chinese-locale orders and a US order of exactly 500, waits for an administrator."
    technical_note: "PurchaseOrderMDB.canIApprove compares PurchaseOrder.getTotalPrice() against bare literals 500 (Locale.US) and 50000 (Locale.JAPAN); every other locale falls through to false. The total is compared in the order's own currency units; no currency conversion happens (the Javadoc calls it 'just a stub for converting currency' used for demonstration). When it returns true, doWork builds an OrderApproval with one ChangedOrder(orderId, APPROVED)."
    confidence: "medium"
    confidence_basis: "The limits are read in exactly one place as bare literals with no configuration or test. The user guide corroborates the US limit (<$500) but says nothing of ja_JP or zh_CN and is inconsistent at the 500 boundary, so it cannot raise the grade to high. Not low because the code path is unambiguous and plainly reachable."
    risk_class: "financial"
    basis: "canIApprove in PurchaseOrderMDB; user guide section 2.5 and 3.1/3.3 describe the $500 auto-approval."
    traces:
      - path: "legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
        line_start: 178
        line_end: 191
        excerpt: "  /**\n   * Just a stub for converting currency. This method is used for\n   * demonstrating the petstore, so that smaller orders can flow through\n   * the system without having to fire up the admin Gui to approve orders\n   */\n  private boolean canIApprove(PurchaseOrder purchaseOrder) {\n    Locale locale = purchaseOrder.getLocale();\n    if (locale.equals(Locale.US)) {\n      if (purchaseOrder.getTotalPrice() < 500) return true;\n    } else if (locale.equals(Locale.JAPAN))  {\n      if (purchaseOrder.getTotalPrice() < 50000) return true;\n    }\n    return false;\n  }\n"
