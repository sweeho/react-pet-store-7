  - record_key: "OFF-WF-0002"
    kind: "workflow"
    capability_key: "order-fulfillment"
    requirement: "The system SHALL accept invoices published by the supplier, each naming an order and the items and quantities just shipped, and SHALL add each shipped quantity to the matching order line. WHEN, after that, every line of the order has a shipped quantity equal to its ordered quantity THEN the system SHALL set the order to COMPLETED and send a completed-order notice; OTHERWISE it SHALL set the order to SHIPPED_PART."
    plain_text: "Each time the supplier reports a shipment, the order is updated. When everything ordered has shipped, the order is completed and the customer is told; until then it is marked part-shipped."
    technical_note: "InvoiceMDB subscribes to topic jms/opc/InvoiceTopic. doWork parses TPA-Invoice XML (TPAInvoiceXDE builds a map itemId -> quantity), calls PurchaseOrderHelper.processInvoice (components/purchaseorder) which increments quantityShipped and returns true only when quantity == quantityShipped for every line, then ProcessManager.updateStatus COMPLETED or SHIPPED_PART. On COMPLETED the order id (plain text, not XML) is sent to jms/opc/MailCompletedOrderQueue by InvoiceTD. No check of the order's current status is made before applying an invoice."
    interface: true
    confidence: "high"
    confidence_basis: "Status decision read in InvoiceMDB, invoice parsing in TPAInvoiceXDE, topic and mail-queue bindings in the vendor descriptor, and the user guide's COMPLETED definition ('All lines shipped and invoiced') agrees. The equality test itself lives outside this shard and was read only for context."
    risk_class: "financial"
    basis: "InvoiceMDB.doWork/onMessage, TPAInvoiceXDE.extractData, deployment bindings, user guide section 5."
    traces:
      - path: "legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java"
        line_start: 157
        line_end: 173
        excerpt: "  private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {\n    String completedOrder = null;\n    PurchaseOrderHelper poHelper = new PurchaseOrderHelper();\n    invoiceXDE.setDocument(xmlInvoice);\n    PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());\n    boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());\n\n    //update process manager if this order is completely done, or partially done\n    //for this purchase order\n    if(orderDone) {\n      processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);\n      completedOrder = invoiceXDE.getOrderId();\n    } else {\n      processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);\n    }\n    return completedOrder;\n  }\n"
