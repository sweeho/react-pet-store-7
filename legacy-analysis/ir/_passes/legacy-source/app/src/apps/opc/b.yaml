  - record_key: "NOT-RULE-0004"
    kind: "business-rule"
    capability_key: "order-notifications"
    requirement: "The system SHALL choose the e-mail body template by the order's locale (en_US, ja_JP, zh_CN), falling back to the default English template when the order carries no locale or one that cannot be parsed as language_COUNTRY. GIVEN an order locale for which no template exists WHEN a notice is built THEN the notice SHALL fail and SHALL NOT be sent. Japanese-locale bodies SHALL show prices as yen with no decimals ('￥#,##0'); English and Chinese bodies SHALL show prices as dollars with two decimals ('$#,##0.00'). E-mail subjects SHALL be in English for every locale."
    plain_text: "Customer e-mails are written in the order's language (English, Japanese or Chinese). Japanese e-mails show prices in yen; English and Chinese e-mails show them in dollars. The subject line is always English."
    technical_note: "MailContentXDE.getStyleSheetPath appends '_' + locale.toString() to the stylesheet base name; getTransformer throws FormatterException 'No style sheet found for locale' when the resource is missing, which the MDBs rethrow as EJBException (transaction rollback). MailOrderApprovalMDB and MailInvoiceMDB convert the stored locale string with LocaleUtil.getLocaleFromString (null when no '_' -> default template); MailCompletedOrderMDB uses the PO's Locale directly. Currency patterns are hard-coded per template."
    confidence: "medium"
    confidence_basis: "Template-path logic is read in one helper; the currency formats are bare literals in the templates. The fallback and failure behaviour are read, not tested; no document describes e-mail language."
    risk_class: "presentational"
    basis: "MailContentXDE path resolution and failure, LocaleUtil parsing, per-locale XSL files."
    traces:
      - path: "legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailContentXDE.java"
        line_start: 136
        line_end: 165
        excerpt: "  private Transformer getTransformer(Locale locale) throws FormatterException {\n    Transformer transformer = (Transformer) transformers.get(locale);\n    if (transformer == null) {\n      InputStream stream = getClass().getResourceAsStream(getStyleSheetPath(styleSheetPath, locale));\n      if (stream != null) {\n        try {\n          transformer = transformerFactory.newTransformer(new StreamSource(stream));\n          transformers.put(locale, transformer);\n        } catch (Exception exception) {\n          throw new FormatterException(exception);\n        }\n      } else {\n        throw new FormatterException(\"No style sheet found for locale: \" + locale);\n      }\n    }\n    return transformer;\n  }\n\n  private String getStyleSheetPath(String styleSheetPath, Locale locale) {\n    if (locale != null) {\n      int i = styleSheetPath.lastIndexOf('.');\n      if (i >= 0) {\n        String suffix = styleSheetPath.substring(i);\n        String base = styleSheetPath.substring(0, i);\n        return base + \"_\" + locale.toString() + suffix;\n      }\n      return styleSheetPath + \"_\" + locale.toString();\n    }\n    return styleSheetPath;\n  }\n"
      - path: "legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java"
        line_start: 48
        line_end: 75
        excerpt: "  public static Locale getLocaleFromString(String localeString) {\n    if (localeString == null) return null;\n    if (localeString.toLowerCase().equals(\"default\")) return Locale.getDefault();\n    int languageIndex = localeString.indexOf('_');\n    if (languageIndex  == -1) return null;\n    int countryIndex = localeString.indexOf('_', languageIndex +1);\n    String country = null;\n    if (countryIndex  == -1) {\n      if (localeString.length() > languageIndex) {\n        country = localeString.substring(languageIndex +1, localeString.length());\n      } else {\n        return null;\n      }\n    }\n    int variantIndex = -1;\n    if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);\n    String language = localeString.substring(0, languageIndex);\n    String variant = null;\n    if (variantIndex  != -1) {\n      variant = localeString.substring(variantIndex +1, localeString.length());\n    }\n    if (variant != null) {\n      return new Locale(language, country, variant);\n    } else {\n      return new Locale(language, country);\n    }\n\n  }\n"
