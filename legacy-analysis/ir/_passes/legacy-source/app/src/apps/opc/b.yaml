findings:
  - kind: "ambiguity"
    path: "legacy-source/app/src/apps/opc/src/ejb-jar.xml"
    description: "Every env-entry value in ejb-jar.xml is redacted, including the XML validation switches (param/xml/validation/PurchaseOrder, Invoice, OrderApproval; param/xml/XSDValidation) and the configured OrderApproval transition delegate class name. Whether inbound order, approval and invoice messages are schema-validated in production cannot be read, so no requirement was emitted for input validation. A human needs the unredacted values."
  - kind: "ambiguity"
    path: "legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java"
    description: "Every message handler converts any failure into a runtime exception under a Required container transaction, so the message is rolled back and redelivered. The redelivery limit and any dead-letter handling are application-server configuration not present in this module; a malformed order, approval or invoice may be redelivered indefinitely. A human needs to state the intended retry/poison-message policy."
  - kind: "ambiguity"
    path: "legacy-source/app/src/apps/opc/src/docroot/EntityCatalog.jsp"
    description: "EntityCatalog.jsp only publishes the XML schema locations used to validate exchanged documents; it is technical plumbing and produced no record. Its URL is hard-wired to http://localhost:8000/opc/EntityCatalog.jsp in sun-j2ee-ri.xml."
