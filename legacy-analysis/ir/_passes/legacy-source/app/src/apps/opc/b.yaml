  - record_key: "OAP-WF-0004"
    kind: "workflow"
    capability_key: "order-approval"
    requirement: "The system SHALL accept a batch of order approval decisions (each an order id and a new status such as APPROVED or DENIED) from the administrator client, and for each PENDING order in the batch SHALL set the order to the decided status, include it in a single batched customer-notification message, and, when the decided status is APPROVED, build a supplier purchase order for it. After the whole batch is processed the system SHALL send every supplier purchase order and then the one notification batch, within the same transaction as the status updates."
    plain_text: "The administrator can approve or deny many pending orders at once. Each approved order is passed on to the supplier, and every approved or denied customer is queued for an e-mail."
    technical_note: "OrderApprovalMDB listens on jms/opc/OrderApprovalQueue. doWork parses OrderApproval XML (optional validation via param/xml/validation/OrderApproval), calls ProcessManager.updateStatus with whatever status the ChangedOrder carries (the MDB itself does not restrict the value to APPROVED/DENIED), and for APPROVED builds TPASupplierOrder XML. The transition delegate class is configured by env-entry param/transitiondelegate/OrderApprovalTD (value redacted in the source; OrderApprovalTD is the in-tree implementation), which sends each PO to jms/supplier/PurchaseOrderQueue and the notification batch to jms/opc/MailOrderApprovalQueue. Container transaction Required on onMessage."
    interface: true
    confidence: "high"
    confidence_basis: "Read end-to-end in OrderApprovalMDB and OrderApprovalTD with queue bindings in the deployment descriptor, and the user guide 3.3 describes the batch approve/deny-then-commit flow. The only gap is that the configured transition-delegate class name is redacted, so that it is OrderApprovalTD is inferred from it being the only matching implementation."
    risk_class: "financial"
    basis: "OrderApprovalMDB.doWork loop, OrderApprovalTD.doTransition, deployment bindings, user guide section 3.3."
    traces:
      - path: "legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java"
        line_start: 185
        line_end: 228
        excerpt: "  private WorkResult doWork(String xmlMessage) throws XMLDocumentException, FinderException  {\n\n    ArrayList supplierPoList = new ArrayList();\n    PurchaseOrderLocal po = null;\n    OrderApproval approval = null;\n\n    approval = OrderApproval.fromXML(xmlMessage, entityCatalogURL, validateXmlOrderApproval);\n\n    //generate list of valid orders to return\n    OrderApproval oaMailList = new OrderApproval();\n    String xmlMailOrderApprovals = null;\n    Collection coll = approval.getOrdersList();\n    Iterator it = coll.iterator();\n\n    while(it!= null && it.hasNext()) {\n      ChangedOrder co = (ChangedOrder) it.next();\n      // only PENDING orders can be updated\n      //if order alreay APPROVED or DENIED or COMPLETED, then order\n      //already processed so dont process again\n      String curStatus = processManager.getStatus(co.getOrderId());\n      if(!curStatus.equals(OrderStatusNames.PENDING)) {\n        continue;\n      }\n      //generate list of valid orders to return\n      //list contains orders to notify the customer of\n      //order status changes. List is sent to customer\n      //relations for emailing.\n      oaMailList.addOrder(co);\n\n      //update process manager\n      //for this purchase order workflow\n      processManager.updateStatus(co.getOrderId(), co.getOrderStatus());\n\n      //for all approved orders, send a PO to supplier\n      if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {\n        po = poHome.findByPrimaryKey(co.getOrderId());\n        String xmlPO = getXmlPO(po, supplierOrderXDE);\n        supplierPoList.add(xmlPO);\n      }\n    }//end while\n\n    xmlMailOrderApprovals = oaMailList.toXML();\n    return new WorkResult(xmlMailOrderApprovals, supplierPoList);\n  }\n"
