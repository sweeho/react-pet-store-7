    kind: "integration"
    capability_key: "checkout"
    requirement: "The system SHALL accept each purchase order submitted by the storefront as an asynchronous message, record the order with its contact, address, line items, total, locale and e-mail, and start its order workflow in status PENDING before any approval decision is taken."
    plain_text: "Every order the shop sends in is saved and starts life as 'pending' before anyone (or anything) decides whether to approve it."
    technical_note: "PurchaseOrderMDB.onMessage/doWork parses the PurchaseOrder XML (PurchaseOrder.fromXML, optional DTD/XSD validation per env-entry param/xml/validation/PurchaseOrder), creates the PurchaseOrder CMP entity (poHome.create) and calls ProcessManager.createManager(orderId, PENDING). The MDB listens on queue jms/opc/OrderQueue (sun-j2ee-ri.xml). onMessage runs with container transaction Required, so any failure rolls the whole step back."
    interface: true
    confidence: "high"
    confidence_basis: "The create-then-PENDING sequence is read directly in the bean, and the queue binding is declared separately in the deployment descriptor; the user guide also states the storefront sends the order to the OPC asynchronously. Three independent places agree."
    risk_class: "financial"
