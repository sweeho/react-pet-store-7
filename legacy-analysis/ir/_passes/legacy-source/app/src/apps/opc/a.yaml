  - record_key: APPR-BR-0005
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL apply an approval or denial only to an order whose current
      status is PENDING.
      GIVEN an order already APPROVED, DENIED or COMPLETED WHEN an approval
      decision for it arrives THEN the decision is ignored, no status change is
      made, no supplier order is sent and no customer notice is produced for it.
    plain_text: >
      Only a pending order can be approved or denied. A decision on an order that
      has already been decided is silently ignored.
    technical_note: >
      OrderApprovalMDB.doWork reads processManager.getStatus(orderId) and
      `continue`s past any order whose status is not PENDING, before adding it to
      the mail list or the supplier PO list.
    interface: false
    confidence: medium
    confidence_basis: >
      One clear code site with a matching inline comment; no declarative or schema
      constraint enforces it (the status column is a free VARCHAR).
    risk_class: operational
    basis: >
