# Spec extraction SX-0001, pass A, shard legacy-source/app/src/apps/opc
# Order Processing Center (OPC): order intake, approval, supplier hand-off,
# invoice processing, customer mail and the admin reporting facade.
# Classes outside this shard (PurchaseOrder entity, PurchaseOrderHelper,
# ProcessManager, OrderStatusNames, mailer) were not read; records only cite
# what is visible in this shard plus the OPC deployment descriptor DDL.
records:

  # ------------------------------------------------------------------ order-approval
  - record_key: APPR-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve an order placed in the en_US locale
      whose total price is strictly less than 500, and SHALL leave every other
      en_US order pending administrator approval.
      GIVEN an en_US order with total 499.99 WHEN it is received THEN it is approved automatically.
      GIVEN an en_US order with total exactly 500 WHEN it is received THEN it stays PENDING.
    plain_text: >
      A US-English order under $500 is approved automatically; an order of $500 or
      more waits for an administrator to approve or deny it.
    technical_note: >
      PurchaseOrderMDB.canIApprove compares PurchaseOrder.getTotalPrice() with the
      bare literal 500 when the order locale equals Locale.US. The comment calls it
      "just a stub for converting currency" meant for the demo. No configuration
      entry exists for the limit.
    interface: false
    confidence: high
    confidence_basis: >
      One clear code site, independently corroborated by the user guide (sections
      2.5, 3.1 and 3.3 all state the $500 auto-approval limit). Not graded higher
      on the boundary: the guide words the pending case as "greater than $500",
      which disagrees with the code at exactly 500 (see suspected defect).
    risk_class: financial
    basis: >
      `if (purchaseOrder.getTotalPrice() < 500) return true;` inside the
      `Locale.US` branch; the user guide states orders under $500 are approved
      automatically.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 178
        line_end: 191
        excerpt: |2
            /**
             * Just a stub for converting currency. This method is used for
             * demonstrating the petstore, so that smaller orders can flow through
             * the system without having to fire up the admin Gui to approve orders
             */
            private boolean canIApprove(PurchaseOrder purchaseOrder) {
              Locale locale = purchaseOrder.getLocale();
              if (locale.equals(Locale.US)) {
                if (purchaseOrder.getTotalPrice() < 500) return true;
              } else if (locale.equals(Locale.JAPAN))  {
                if (purchaseOrder.getTotalPrice() < 50000) return true;
              }
              return false;
            }
      - kind: document
        path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: "p1, 2.5 Placing an order; 3.3 Approving or denying orders"
        excerpt: |2
          The Storefront sends the order to the OPC asynchronously. Because the order is less than $500, the
          OPC approves it automatically.
          An order is pending if its total value is greater than $500.
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      jms.queue: jms/opc/OrderQueue

