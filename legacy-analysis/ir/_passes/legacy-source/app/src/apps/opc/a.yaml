        line_start: 227
        line_end: 228
        excerpt: |2
                  <resource-env-ref-name>jms/PurchaseOrderQueue</resource-env-ref-name>
                  <jndi-name>jms/supplier/PurchaseOrderQueue</jndi-name>
    stack_metadata:
