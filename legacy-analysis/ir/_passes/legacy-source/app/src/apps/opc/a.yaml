  # ------------------------------------------------------------------ order-fulfillment
  - record_key: FULF-INT-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      For each approved order the system SHALL send the supplier a purchase order
      carrying the order id, the order date, the ship-to name (given and family),
      street line 1, city, state, country, postal code, e-mail and telephone, and
      for each line item its category, product, item, line number, quantity and
      unit price.
    plain_text: >
      When an order is approved, the supplier receives the order number and date,
      the delivery name, address and contact details, and every ordered line with
      quantity and unit price. Payment details are not sent to the supplier.
    technical_note: >
      OrderApprovalMDB.getXmlPO fills a TPASupplierOrderXDE from the PurchaseOrder
      entity's ContactInfo/Address and line items and sends it to
      jms/supplier/PurchaseOrderQueue (sun-j2ee-ri.xml). Only streetName1 is
      passed; streetName2 exists in the Address table but is not sent. The TPA
      schemas are published through the entity catalog (FULF-INT-0004).
    interface: true
    confidence: high
    confidence_basis: >
      The field list is read directly from the builder; the destination is
      declared in the deployment descriptor; the discovery report's message-flow
      section names the same queue and consumer.
    risk_class: operational
    basis: >
      `supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(), addr.getStreetName1(), ...)`
      and `supplierOrderXDE.addLineItem(...)` per line.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 248
        line_end: 268
        excerpt: |2
            private String getXmlPO(PurchaseOrderLocal po, TPASupplierOrderXDE supplierOrderXDE) throws XMLDocumentException{
              supplierOrderXDE.newDocument();
              supplierOrderXDE.setOrderId(po.getPoId());
              Date tmpDate = new Date(po.getPoDate());
              supplierOrderXDE.setOrderDate(tmpDate);
              ContactInfoLocal cinfo = po.getContactInfo();
              AddressLocal addr = cinfo.getAddress();
              supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(),
                                                  addr.getStreetName1(), addr.getCity(),
                                                  addr.getState(), addr.getCountry(),
                                                  addr.getZipCode(), cinfo.getEmail(), cinfo.getTelephone());
              //Collection liColl = po.getAllItems();
              Collection liColl = po.getData().getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItem li = (LineItem) liIt.next();
                supplierOrderXDE.addLineItem(li.getCategoryId(), li.getProductId(), li.getItemId(),
                                             li.getLineNumber(), li.getQuantity(), li.getUnitPrice());
              }
              return supplierOrderXDE.getDocumentAsString();
            }
