  - record_key: APPR-WF-0006
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL accept approval decisions as a batch of (order, new status)
      pairs; for each pending order in the batch it SHALL set the order status to
      the decided status, SHALL send a supplier purchase order for each order
      decided APPROVED, SHALL send no supplier purchase order for an order decided
      DENIED, and SHALL pass the list of applied decisions on for customer
      notification.
    plain_text: >
      The administrator can approve or deny several orders at once. Each approved
      order is sent to the supplier for fulfilment; denied orders are not. The
      customers of all decided orders are then notified.
    technical_note: >
      OrderApprovalMDB.doWork iterates OrderApproval.getOrdersList(), calls
      processManager.updateStatus(orderId, status), and for APPROVED builds a
      TPASupplierOrder XML (getXmlPO). OrderApprovalTD then sends each supplier PO
      to jms/supplier/PurchaseOrderQueue and one OrderApproval XML of applied
      decisions to jms/opc/MailOrderApprovalQueue. The status value written is
      whatever the message carries; no check that it is APPROVED or DENIED.
    interface: false
    confidence: high
    confidence_basis: >
      Code in OrderApprovalMDB and OrderApprovalTD plus the user guide's
      description of committing several approve/deny decisions at once.
    risk_class: operational
    basis: >
      `processManager.updateStatus(co.getOrderId(), co.getOrderStatus());` and
      `if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) { ... supplierPoList.add(xmlPO); }`
