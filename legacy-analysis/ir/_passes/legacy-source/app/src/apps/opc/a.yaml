  - record_key: FULF-REQ-0007
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL process each incoming order, approval batch, invoice and
      notification message as one unit of work: IF any step fails THEN none of
      that message's status changes or outgoing messages SHALL take effect and the
      message SHALL be returned for redelivery.
    plain_text: >
      Each step of order processing either completes fully or not at all, so a
      failure never leaves an order half-updated or loses the message.
    technical_note: >
      Every OPC message bean is container-managed with trans-attribute Required on
      onMessage; failures are rethrown as EJBException (rollback). QueueHelper
      sends on a transacted session (createQueueSession(true, 0)), so outgoing
      sends join the transaction. Filed under order-fulfillment as the closest
      capability; it equally governs order-approval and order-notifications.
      Redelivery limits are container settings not present in this shard.
    interface: false
    confidence: high
    confidence_basis: >
      Declared transaction attributes in ejb-jar.xml for all six message beans
      plus the uniform rethrow-as-EJBException code in every onMessage.
    risk_class: operational
    basis: >
