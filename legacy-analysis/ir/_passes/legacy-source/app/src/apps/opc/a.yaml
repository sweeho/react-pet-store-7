  - record_key: FULF-WF-0003
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      WHEN an invoice for an order is received the system SHALL record the
      shipped items against the order; IF every item of the order has then been
      shipped the system SHALL set the order status to COMPLETED and SHALL trigger
      the completed-order notification; OTHERWISE it SHALL set the order status
      to SHIPPED_PART.
    plain_text: >
      Each shipment is recorded against the order. When everything ordered has
      shipped, the order becomes Completed and the customer is told; until then
      it shows as partly shipped.
    technical_note: >
      InvoiceMDB.doWork calls PurchaseOrderHelper.processInvoice(po, lineItemIds)
      (outside this shard; it decides "all shipped", presumably against the
      LineItem quantityShipped column), then processManager.updateStatus to
      COMPLETED or SHIPPED_PART. On COMPLETED, InvoiceTD sends the order id to
      jms/opc/MailCompletedOrderQueue. The current status is not checked first.
    interface: false
    confidence: medium
    confidence_basis: >
      The branch is clear in InvoiceMDB, and the guide's status table agrees that
      COMPLETED means all lines shipped. The "all shipped" test itself lives in
      PurchaseOrderHelper, outside this shard, and was not read; SHIPPED_PART is
      absent from the guide.
    risk_class: operational
    basis: >
