  - record_key: NOTIF-BR-0004
    kind: business-rule
    capability_key: order-notifications
    requirement: >
      The system SHALL render each customer e-mail body from a template for the
      order's locale, with templates for en_US, ja_JP and zh_CN and a default
      English template used when the order has no recognisable locale; prices
      SHALL be shown as "$#,##0.00" in the en_US, zh_CN and default templates and
      as "￥#,##0" in the ja_JP template.
      GIVEN an order locale for which no template exists (for example fr_FR) WHEN
      an e-mail is generated THEN generation fails rather than falling back to the
      default template.
    plain_text: >
      E-mails are written in the customer's language (English, Japanese or
      Chinese). Japanese e-mails show prices in yen without decimals; the others
      show dollars and cents. There is no fallback for any other language.
    technical_note: >
      MailContentXDE.getStyleSheetPath appends "_" + locale.toString() to the
      stylesheet name; a null locale uses the unsuffixed file. A missing resource
      throws FormatterException("No style sheet found for locale: ..."), which the
      MDBs rethrow as EJBException. LocaleUtil.getLocaleFromString returns null
      for strings without "_" and Locale.getDefault() for "default".
    interface: false
    confidence: medium
    confidence_basis: >
      Template lookup is one code path; the template set and price masks are read
      from the stylesheet files. Which locales the storefront can actually put on
      an order was not verified in this shard.
    risk_class: presentational
    basis: >
      `return base + "_" + locale.toString() + suffix;`; `throw new FormatterException("No style sheet found for locale: " + locale);`;
      `format-number(UnitPrice, '￥#,##0')` in the ja_JP templates.
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailContentXDE.java
        line_start: 136
        line_end: 165
        excerpt: |2
            private Transformer getTransformer(Locale locale) throws FormatterException {
              Transformer transformer = (Transformer) transformers.get(locale);
              if (transformer == null) {
                InputStream stream = getClass().getResourceAsStream(getStyleSheetPath(styleSheetPath, locale));
                if (stream != null) {
                  try {
                    transformer = transformerFactory.newTransformer(new StreamSource(stream));
                    transformers.put(locale, transformer);
                  } catch (Exception exception) {
                    throw new FormatterException(exception);
                  }
                } else {
                  throw new FormatterException("No style sheet found for locale: " + locale);
                }
              }
              return transformer;
            }

            private String getStyleSheetPath(String styleSheetPath, Locale locale) {
              if (locale != null) {
                int i = styleSheetPath.lastIndexOf('.');
                if (i >= 0) {
                  String suffix = styleSheetPath.substring(i);
                  String base = styleSheetPath.substring(0, i);
                  return base + "_" + locale.toString() + suffix;
                }
                return styleSheetPath + "_" + locale.toString();
              }
              return styleSheetPath;
            }
