  - record_key: APPR-WF-0004
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL record every received order with status PENDING before any
      approval decision, and an automatic approval SHALL be issued as an approval
      decision through the same path as an administrator's decision (so it gets
      the same supplier hand-off and customer notification).
    plain_text: >
      Every order starts as Pending. An automatic approval is handled exactly like
      an administrator's approval, so the customer is notified and the supplier
      receives the order in the same way.
    technical_note: >
      PurchaseOrderMDB.doWork creates the PurchaseOrder entity, calls
      processManager.createManager(orderId, PENDING), and if canIApprove is true
      builds an OrderApproval XML containing one ChangedOrder(orderId, APPROVED).
      PurchaseOrderTD sends it to jms/OrderApprovalQueue, the same queue the admin
      client writes to, consumed by OrderApprovalMDB.
    interface: false
    confidence: high
    confidence_basis: >
      Code in PurchaseOrderMDB plus the queue wiring in PurchaseOrderTD and the
      deployment descriptor (OrderApprovalQueue bound to OrderApprovalMDB) agree.
    risk_class: operational
    basis: >
      `poHome.create(purchaseOrder); processManager.createManager(purchaseOrder.getOrderId(), OrderStatusNames.PENDING);`
      followed by an OrderApproval with APPROVED sent to the order approval queue.
    traces:
