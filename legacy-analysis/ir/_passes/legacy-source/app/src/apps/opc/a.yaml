      jms.queue: jms/supplier/PurchaseOrderQueue
      xml.document: TPASupplierOrder

  - record_key: FULF-INT-0002
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL receive supplier invoices as XML documents published to
      the invoice topic, each carrying an order id and a list of shipped line
      items identified by item id with a shipped quantity, and SHALL reject a
      document whose root element is not an Invoice in the TPA invoice namespace.
    plain_text: >
      The supplier reports each shipment back as an invoice naming the order and
      the items and quantities shipped.
    technical_note: >
      InvoiceMDB and MailInvoiceMDB both subscribe to jms/opc/InvoiceTopic
      (destination-type Topic). TPAInvoiceXDE.extractData reads OrderId and the
      LineItem itemId/quantity attributes into a HashMap keyed by itemId, and
      throws "Invoice element expected." for any other root. Validation flags
      param/xml/validation/Invoice and param/xml/XSDValidation are redacted.
    interface: true
    confidence: high
    confidence_basis: >
      Parser code, the Topic destination type in ejb-jar.xml and both subscriber
      bindings in sun-j2ee-ri.xml agree.
    risk_class: operational
    basis: >
      `lineItemIds.put(XMLDocumentUtils.getAttribute(child, XML_ITEMID, false), new Integer(...XML_QUANTITY...))`
      and `throw new XMLDocumentException(XML_INVOICE + " element expected.");`
    traces:
      - path: legacy-source/app/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/TPAInvoiceXDE.java
        line_start: 123
        line_end: 139
        excerpt: |2
            private void extractData() throws XMLDocumentException {
                  Element element = invoiceDocument.getDocumentElement();
                  if (element.getLocalName().equals(XML_INVOICE) && element.getNamespaceURI().equals(INVOICE_NS)) {
                Element child;
                child = XMLDocumentUtils.getFirstChildNS(element, INVOICE_NS, XML_ORDERID, false);
                orderId = XMLDocumentUtils.getContentAsString(child, false);
                child = XMLDocumentUtils.getSiblingNS(child, INVOICE_NS, XML_LINEITEMS, false);
                for (child = XMLDocumentUtils.getFirstChildNS(child, LINEITEM_NS, XML_LINEITEM, false);
                     child != null;
                     child = XMLDocumentUtils.getNextSiblingNS(child, LINEITEM_NS, XML_LINEITEM, true)) {
                          lineItemIds.put(XMLDocumentUtils.getAttribute(child, XML_ITEMID, false),
                                  new Integer(XMLDocumentUtils.getAttributeAsInt(child, XML_QUANTITY, false)));
                }
                return;
                  }
                  throw new XMLDocumentException(XML_INVOICE + " element expected.");
            }
