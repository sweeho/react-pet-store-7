records:
  - record_key: CUST-ENT-0001
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL represent a postal address as six text fields (street line 1, street line 2,
      city, state, zip code, country) and SHALL persist it as a stand-alone record.
    confidence: high
    confidence_basis: >
      The six fields are declared in the persistence descriptor and again as accessors in the entity
      bean and the value object: three places that agree.
    risk_class: operational
    basis: >
      ejb-jar.xml declares six container-managed fields; AddressEJB and Address declare the same six.
    plain_text: >
      An address is kept as street line 1, street line 2, city, state, zip code and country.
    technical_note: >
      CMP 2.x entity AddressEJB (abstract schema Address) exposed through a local home; Address is the
      serialisable value object returned by getData(). No DDL for the table is in this component.
    interface: false
    traces:
      - path: legacy-source/app/src/components/address/src/ejb-jar.xml
        line_start: 52
        line_end: 80
        excerpt: |
          <persistence-type>Container</persistence-type>
          <prim-key-class>java.lang.Object</prim-key-class>
          <reentrant>False</reentrant>
          <cmp-version>2.x</cmp-version>
          <abstract-schema-name>Address</abstract-schema-name>
          <cmp-field>
            <description>no description</description>
            <field-name>zipCode</field-name>
          </cmp-field>
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 53
        line_end: 69
        excerpt: |
          public abstract String getStreetName1();
          public abstract void setStreetName1(String streetName1);

          public abstract String getStreetName2();
          public abstract void setStreetName2(String streetName2);

          public abstract String getCity();
          public abstract void setCity(String city);
    stack_metadata:
      framework: EJB 2.0 CMP entity
      ejb.bean: AddressEJB
      ejb.transaction: not declared in this component

  - record_key: CUST-BR-0001
