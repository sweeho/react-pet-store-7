  - record_key: CUST-INT-0001
    kind: integration
    capability_key: customer-accounts
    requirement: >
      The system SHALL exchange an address in an XML form with elements Address containing StreetName
      (once or twice), City, State, ZipCode and Country, in that order, and SHALL omit the second
      StreetName when street line 2 is null or empty.
    confidence: high
    confidence_basis: >
      The element order is stated in the DTD and implemented in toDOM/fromDOM: two places.
    risk_class: operational
    basis: >
      Address.toDOM writes the elements in order and skips an empty second street; fromDOM reads them back
      in the same order and rejects a root element not named Address.
    plain_text: >
      When an address is passed to another part of the system as a document, it is written as street
      (one or two lines), city, state, zip code and country; a blank second street line is left out.
    technical_note: >
      DTD public id "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Address 1.1//EN". Used when
      addresses are embedded in purchase-order XML documents (consumer not in this component).
    interface: true
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 180
        excerpt: |
          Element root = document.createElement(XML_ADDRESS);
          XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
          if (streetName2 != null && !streetName2.equals("")) {
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
          }
          ...
          throw new XMLDocumentException(XML_ADDRESS + " element expected.");
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
    stack_metadata:
      framework: EJB 2.0 / XML DOM
      db.object: n/a

suspected_defects:
  - capability_key: customer-accounts
    record_keys: [CUST-INT-0001]
    severity: low
    category: contradicts-document
    title: Country is optional in the DTD but mandatory when reading an address
    description: >
      The DTD marks Country as optional, but fromDOM requires a Country element after ZipCode (the
      lookup is called with optional=false), so a document valid under the DTD without Country is rejected.
    traces:
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
      - path: legacy-source/app/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 175
        line_end: 176

findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/address/src/ejb-jar.xml
    description: >
      Address has no persistence DDL and no authorisation beyond unchecked local method permissions in this
      component; table definition and who may read or change addresses must be settled from the schema and
      the calling components. No document under legacy-analysis/sources bears on this module (none present).
