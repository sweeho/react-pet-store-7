    capability_key: customer-accounts
    requirement: >
      The system SHALL store an address exactly as supplied, with no check of required fields, length or
      format when it is created.
    confidence: medium
    confidence_basis: >
      Absence of validation is read from the create methods of this component only; a caller elsewhere
      may validate. Absence is inferred, not stated.
    risk_class: operational
    basis: >
      Every create variant copies its arguments into the fields; the no-argument variant creates an empty
      address. None throws CreateException although all declare it.
    plain_text: >
      The address store does not check that an address is complete or well formed; any checking must
      happen before the address reaches it.
    technical_note: >
      ejbCreate(6 Strings), ejbCreate(Address) and ejbCreate() return null so the container generates
      the key; ejbPostCreate variants are empty.
