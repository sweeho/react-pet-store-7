    path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
    description: >
      The module has no business rules of its own and no capability in the closed list covers shared infrastructure lookup; records are filed under checkout/order-notifications as closest fit. No documents under legacy-analysis/sources bear on this module (directory absent in this tree). The legacy-source tree was absent from the worktree and was read from commit 0683ff9.
