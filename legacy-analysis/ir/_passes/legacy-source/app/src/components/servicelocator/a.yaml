records:
  - record_key: ORDER-NOTIFICATIONS-INT-0001
    kind: integration
    capability_key: order-notifications
    requirement: >
      The system SHALL resolve named infrastructure resources (EJB local and remote homes, JMS queue and topic
      connection factories, queues, topics, data sources, and URL, boolean and string environment entries) by
      looking the name up in the container naming service, and SHALL return the resolved object to the caller.
    confidence: high
    confidence_basis: >
      Same lookup pattern is repeated in two implementations (web and ejb variants) for every resource type.
      Not graded higher because no test or config was read in this shard.
    risk_class: operational
    basis: >
      Both ServiceLocator classes wrap a JNDI InitialContext and expose one typed getter per resource kind.
      No listed capability fits an infrastructure helper; filed under order-notifications because the queue
      and topic getters serve the order-messaging flows (callers include the mail and order MDBs).
    plain_text: >
      The application finds the shared services it depends on, such as message queues, the database connection
      and configuration values, by name through one central lookup, so the rest of the application does not
      need to know where they live.
    technical_note: >
      ejb/ServiceLocator.java and web/ServiceLocator.java call ic.lookup(name) per getter. Remote homes are
      narrowed with PortableRemoteObject.narrow. Callers include opc MDBs and AdminRequestBD.
    interface: true
    stack_metadata:
      framework: J2EE
      jms.queue: lookup by caller-supplied name
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 109
        line_end: 114
        excerpt: |
          if (cache.containsKey(jndiHomeName)) {
                      home = (EJBLocalHome) cache.get(jndiHomeName);
                  } else {
                      home = (EJBLocalHome) ic.lookup(jndiHomeName);
                      cache.put(jndiHomeName, home);
                  }
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 83
        line_end: 90
