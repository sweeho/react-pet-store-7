  - record_key: ORDER-NOTIFICATIONS-REQ-0004
    kind: requirement
    capability_key: order-notifications
    requirement: >
      The system SHALL report any failure to resolve a named resource to the caller as a single locator
      exception type that retains the underlying cause, whose root-cause accessor returns the innermost cause
      and whose text form is that of the wrapped cause.
    confidence: high
    confidence_basis: >
      Every getter in both classes wraps failures identically, and the exception class implements the
      unwrapping explicitly.
    risk_class: operational
    basis: >
      All lookups catch NamingException and Exception and rethrow ServiceLocatorException.
    plain_text: >
      When a shared service cannot be found, the caller gets one consistent kind of error that still shows the
      original reason.
    technical_note: >
      ServiceLocatorException.getRootCause recurses through nested locator exceptions; toString delegates to the cause.
    interface: false
    stack_metadata:
      framework: J2EE
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 92
        line_end: 104
        excerpt: |
          public Exception getRootCause() {
              if (exception instanceof ServiceLocatorException) {
                return ((ServiceLocatorException) exception).getRootCause();
              }
              return exception == null ? this : exception;
            }
          
            public String toString() {
              if (exception instanceof ServiceLocatorException) {
                return ((ServiceLocatorException) exception).toString();
              }
              return exception == null ? super.toString() : exception.toString();
            }
suspected_defects:
  - capability_key: order-notifications
    record_keys: [ORDER-NOTIFICATIONS-REQ-0002]
    severity: low
    category: error-swallowed
    title: Web locator singleton creation failure is only printed
    description: >
      If the shared instance cannot be created at class load, the error is written to standard error and the
      instance stays null; getInstance() then returns null and callers fail later with a null reference.
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 74
        line_end: 81
  - capability_key: order-notifications
    record_keys: [ORDER-NOTIFICATIONS-INT-0001]
    severity: low
    category: other
    title: getBoolean fails with a null reference if the entry is missing or null
    description: >
      getBoolean unboxes the looked-up value outside the try block; a null result raises an unwrapped
      NullPointerException instead of the locator exception.
    traces:
