                      home = (EJBLocalHome) cache.get(jndiHomeName);
                  } else {
                      home = (EJBLocalHome) ic.lookup(jndiHomeName);
                      cache.put(jndiHomeName, home);
                  }
  - record_key: ORDER-NOTIFICATIONS-REQ-0003
    kind: business-rule
    capability_key: order-notifications
    requirement: >
      GIVEN a URL, boolean or string environment entry is requested from the web-tier locator, WHEN it is
      requested repeatedly, THEN the system SHALL perform a fresh naming lookup each time and SHALL NOT cache it.
    confidence: medium
    confidence_basis: >
      Absence of caching is clear in one place; whether it is intentional (so config changes are picked up) is
      not stated anywhere I read.
    risk_class: operational
    basis: >
      getUrl, getBoolean and getString omit the cache check that the other getters have.
    plain_text: >
      Configuration values are read fresh every time, while other shared services are remembered.
    technical_note: web/ServiceLocator.java getUrl/getBoolean/getString call ic.lookup directly.
    interface: false
    stack_metadata:
      framework: J2EE
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 261
