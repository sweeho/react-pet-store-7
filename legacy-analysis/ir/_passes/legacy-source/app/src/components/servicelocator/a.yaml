  - record_key: ORDER-NOTIFICATIONS-REQ-0002
    kind: requirement
    capability_key: order-notifications
    requirement: >
      The web-tier locator SHALL be a single shared instance created once at class load, and SHALL cache
      resolved EJB homes, queue and topic connection factories, queues, topics and data sources by name so a
      repeated request for the same name returns the cached object without a new lookup.
    confidence: high
    confidence_basis: >
      Singleton plus cache-check pattern is visible in the code and a source comment states the cache purpose;
      the same cache logic appears in seven getters.
    risk_class: operational
    basis: >
      Source comment says the map holds references to EJBHomes and JMS resources for re-use. Filed under
      order-notifications as the closest listed capability (see ORDER-NOTIFICATIONS-INT-0001).
    plain_text: >
      Once a shared service has been found, the web side remembers it and reuses it instead of searching again.
    technical_note: >
      web/ServiceLocator.java: synchronized HashMap cache, static singleton me, getInstance(). The ejb variant
      has a public constructor and no cache, so each EJB-tier instance looks up every time.
    interface: false
    stack_metadata:
      framework: J2EE
    traces:
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 70
        line_end: 72
        excerpt: |
          private Map cache; //used to hold references to EJBHomes/JMS Resources for re-use
          
              private static ServiceLocator me;
      - path: legacy-source/app/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 109
        line_end: 114
        excerpt: |
