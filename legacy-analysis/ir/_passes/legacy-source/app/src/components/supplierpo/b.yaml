suspected_defects:
  - capability_key: order-fulfillment
    record_keys: [ORDER-FULFILLMENT-ENTITY-0001]
    severity: medium
    category: data-corruption
    title: Reading a stored order back loses the shipping contact
    description: >
      getData() on the order bean sets the shipping info from the freshly created transfer object's own (null) shipping info instead of from the stored contact, so an order rebuilt from storage has no shipping contact; serialising it to XML would then fail on a null contact.
    traces:
      - path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 205
        line_end: 209
        excerpt: |
          public SupplierOrder getData() {
            SupplierOrder supplierOrder = new SupplierOrder();
            supplierOrder.setOrderId(getPoId());
            supplierOrder.setOrderDate(new Date(getPoDate()));
            supplierOrder.setShippingInfo(supplierOrder.getShippingInfo());
