findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
    description: >
      The status is set to PENDING on creation and has a public setter, but no transition rules (PENDING to APPROVED/DENIED/COMPLETED) exist in this module. A human needs to confirm where they are enforced (callers in other modules).
