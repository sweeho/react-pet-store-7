records:
  - record_key: CUST-ENT-0001
    kind: entity
    capability_key: customer-accounts
    requirement: >
      The system SHALL store a payment card as three text attributes: card number, card type and expiry date, with no further attributes and no length, format or checksum constraint.
    confidence: high
    confidence_basis: >
      Declared in the persistence descriptor (three stored fields), the bean class and the transfer object, plus the XML DTD: more than two places agree. No database DDL for it is in this module, so column constraints are unknown.
    risk_class: regulated
    basis: >
      Descriptor lists exactly cardNumber, cardType, expiryDate as stored fields; abstract accessors in the bean; the transfer object carries the same three.
    plain_text: >
      A saved payment card consists of a card number, a card type and an expiry date, all kept as plain text.
    technical_note: >
      CMP 2.x entity CreditCardEJB, abstract schema CreditCard; primary key class java.lang.Object. No validation anywhere in this module (no Luhn check, no expiry check, no not-null).
    interface: false
    traces:
      - path: legacy-source/app/src/components/creditcard/src/ejb-jar.xml
        line_start: 52
        line_end: 68
        excerpt: |
          <persistence-type>Container</persistence-type>
