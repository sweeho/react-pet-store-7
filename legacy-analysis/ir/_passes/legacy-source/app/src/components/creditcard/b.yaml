suspected_defects:
  - capability_key: customer-accounts
    record_keys: [CUST-REQ-0002]
    severity: medium
    category: other
    title: Inconsistent argument order between card constructors
    description: >
      The create operation takes (number, type, expiry) while the transfer object constructor takes (number, expiry, type); both are strings, so a swap compiles silently and stores the wrong values.
    traces:
      - path: legacy-source/app/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 62
