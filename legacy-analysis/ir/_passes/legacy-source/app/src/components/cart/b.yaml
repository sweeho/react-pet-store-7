  - record_key: SHOP-BR-0004
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN a cart entry whose item cannot be retrieved from the catalog WHEN the cart contents
      or subtotal are produced THEN the system SHALL omit that entry from the listed lines and
      from the subtotal, without reporting an error to the customer, while still counting it in
      the cart item count.
    plain_text: >
      If an item in the cart can no longer be found in the catalog, it silently disappears from
      the cart list and total, but still counts toward the number of items in the cart.
    technical_note: >
      getItems() catches CatalogException per entry and only prints to stdout; the map entry is
      not removed, so getCount() (map size) still includes it. Checkout (OrderEJBAction) also
      builds the order from getItems(), so the item is dropped from the order too.
    interface: false
    confidence: medium
    confidence_basis: >
      The catch-and-continue is explicit in one place; the count mismatch follows directly from
      getCount using the raw map. Whether the catalog ever fails for a stored id in practice is
      not visible.
    risk_class: financial
    basis: >
      catch (CatalogException cce) { System.out.println(...) } inside the per-entry loop.
    traces:
