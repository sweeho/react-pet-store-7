  - record_key: SHOP-BR-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL compute the cart subtotal as the sum, over every cart line, of the item's
      current catalog list price multiplied by its quantity, re-reading prices from the catalog
      each time the subtotal is computed and applying no rounding, discount, tax or shipping.
    plain_text: >
      The cart total is each item's list price times how many, added up. Prices are looked up
      fresh every time, so a price change shows up in a cart that already holds the item.
      No discount, tax or delivery charge is included.
    technical_note: >
      getSubTotal() calls getItems(), which builds CartItems with unitCost = catalog
      Item.getListCost() (the list price, not Item.getUnitCost()), then sums unitCost*quantity
      in double precision. cart.jsp formats it as currency. The unused ShoppingCartModel.getTotalCost()
      implements the same sum.
    interface: false
    confidence: high
    confidence_basis: >
      The list-price choice and the summation are each visible in code, and the same formula
      appears independently in CartItem.getTotalCost/ShoppingCartModel.getTotalCost. Absence of
      discount/tax/shipping is read from the absence of any such term, which is solid within this
      module but those could be applied elsewhere (checkout).
    risk_class: financial
    basis: >
      getSubTotal loop; CartItem constructed with item.getListCost().
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
               Collection items = getItems();
               if (items == null) return null;
               // put the subtotal in the request
               double ret = 0.0d;
               // total up the quantities
               for (Iterator it =items.iterator(); it.hasNext(); ) {
                   CartItem i = (CartItem) it.next();
                   ret += (i.getUnitCost() * i.getQuantity()) ;
               }
               return new Double(ret);
          }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 94
        line_end: 102
        excerpt: |
          item = catalog.getItem(key, locale);
          // convert catalog item to cart item
          CartItem ci = new CartItem(item.getItemId(),
                                 item.getProductId(),
                                 item.getCategory(),
                                 item.getProductName(),
                                 item.getAttribute(),
                                 value.intValue(),
                                 item.getListCost());
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 79
        line_end: 86
        excerpt: |
          public double getTotalCost() {
              double total = 0;
              for (Iterator li = getItems(); li.hasNext(); ) {
                  CartItem item = (CartItem) li.next();
                  total += item.getTotalCost();
              }
              return total;
          }
