    confidence: high
    confidence_basis: >
      Shape is visible in two independent places: the map field and its use in the bean class,
      and the Stateful session-type declaration in ejb-jar.xml. Not graded higher than "high"
      because the session binding itself lives outside this module (ShoppingClientFacade).
    risk_class: operational
    basis: >
      HashMap cart keyed by item id with Integer quantity; session-type Stateful.
    traces:
