    kind: entity
    capability_key: shopping-cart
    requirement: >
      The system SHALL keep one shopping cart per customer session, holding at most one
      entry per catalog item, each entry being the item identifier and a whole-number quantity.
    plain_text: >
      Each shopper has their own cart for the visit. The cart lists each item once, with how
      many of it the shopper wants.
    technical_note: >
      Stateful session bean ShoppingCartEJB holds a HashMap keyed by item id with Integer
      quantity values (ShoppingCartLocalEJB.java). Declared Stateful in ejb-jar.xml, so the
      cart lives as long as the bean instance bound to the user's session; it is not persisted
      to the database.
