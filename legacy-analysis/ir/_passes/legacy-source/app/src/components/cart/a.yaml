  - record_key: CART-RULE-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL set an item's cart quantity to the new quantity the customer enters.
      GIVEN an item in the cart
      WHEN the customer changes its quantity to zero or a negative number
      THEN the system SHALL remove the item from the cart.
      GIVEN an item NOT in the cart
      WHEN a positive quantity is set for it
      THEN the system SHALL add it to the cart with that quantity.
    plain_text: >
      Changing a quantity replaces the old one. Setting a quantity of zero or less removes the item.
      There is no upper limit on the quantity in the cart itself.
    technical_note: >
      ShoppingCartLocalEJB.updateItemQuantity(String,int) removes the key and re-puts it only when
      newQty > 0 (comment: "remove item if it is less than or equal to 0"). No maximum and no stock check
      at this layer. Parsing of the entered quantity happens in the web/EJB action outside this shard.
    confidence: high
    confidence_basis: >
      Code and an inline comment state the same <= 0 removal rule. The absence of an upper bound is
      only what this module shows; a limit could exist in the calling action, which this pass did not
      read in full.
    risk_class: financial
    interface: false
    basis: >
      updateItemQuantity: cart.remove(itemID); if (newQty > 0) cart.put(itemID, newQty).
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |2
              public void updateItemQuantity (String itemID, int newQty) {
                  cart.remove(itemID);
                  // remove item if it is less than or equal to 0
                  if (newQty > 0) cart.put(itemID, new Integer(newQty));
              }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
      ejb.transaction: Required

  - record_key: CART-RULE-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL compute the cart subtotal as the sum, over every cart line, of the item's list
      price multiplied by its quantity, using the list price current in the catalog for the cart's
      locale at the moment the subtotal is requested, with no rounding step, discount, tax or shipping.
    plain_text: >
      The cart total is each item's list (shelf) price times its quantity, added up. Prices are looked
      up fresh each time the cart is shown, in the shopper's language/region, so a price change in the
      catalog changes the cart total. No tax, shipping or discount is applied in the cart.
    technical_note: >
      ShoppingCartLocalEJB.getSubTotal() calls getItems() (which re-reads each item from the catalog via
      CatalogHelper.getItem(id, locale) and takes item.getListCost()) and accumulates unitCost * quantity
      as a Java double. ShoppingCartModel.getTotalCost() sums CartItem.getTotalCost() the same way.
      Prices are not captured at add time.
    confidence: high
    confidence_basis: >
      The same formula is implemented in two places in this module (getSubTotal and
      ShoppingCartModel.getTotalCost via CartItem.getTotalCost). That it is the LIST price rather than
      the member price is read directly from getListCost() and is the subject of a suspected defect.
    risk_class: financial
    interface: false
    basis: >
      getSubTotal loop; CartItem built with item.getListCost(); ShoppingCartModel.getTotalCost.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |2
             public Double getSubTotal() {
                  Collection items = getItems();
                  if (items == null) return null;
                  // put the subtotal in the request
                  double ret = 0.0d;
                  // total up the quantities
                  for (Iterator it =items.iterator(); it.hasNext(); ) {
                      CartItem i = (CartItem) it.next();
                      ret += (i.getUnitCost() * i.getQuantity()) ;
                  }
                  return new Double(ret);
             }
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 94
        line_end: 102
        excerpt: |2
                         item = catalog.getItem(key, locale);
                         // convert catalog item to cart item
                         CartItem ci = new CartItem(item.getItemId(),
                                                item.getProductId(),
                                                item.getCategory(),
                                                item.getProductName(),
                                                item.getAttribute(),
                                                value.intValue(),
                                                item.getListCost());
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 79
        line_end: 86
        excerpt: |2
              public double getTotalCost() {
                  double total = 0;
                  for (Iterator li = getItems(); li.hasNext(); ) {
                      CartItem item = (CartItem) li.next();
                      total += item.getTotalCost();
                  }
                  return total;
              }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
      ejb.transaction: Required

  - record_key: CART-RULE-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      GIVEN an item in the cart that can no longer be read from the catalog for the cart's locale
      WHEN the cart contents or subtotal are requested
      THEN the system SHALL omit that item from the listed lines and from the subtotal, without telling
      the customer, while the item stays in the cart and is still counted in the cart's item count.
    plain_text: >
      If an item in the cart can no longer be found in the catalog, it silently disappears from the
      cart display and the total, but it is still counted as being in the cart.
    technical_note: >
      getItems() catches CatalogException per item, prints to stdout and continues; the map entry is not
