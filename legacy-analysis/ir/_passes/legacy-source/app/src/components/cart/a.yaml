  - capability_key: shopping-cart
    record_keys: [CART-RULE-0002, CART-ENT-0001]
    severity: high
    category: contradicts-document
    title: Cart charges the list price, not the "Your Price" shown to the shopper
    description: >
      The user guide says the item page shows a List Price (shelf price) and a "Your Price" (the
      discounted member price), and the item page displays the catalog unit cost as "Your Price". The
      cart builds every line, and therefore the subtotal, from the catalog list price. A shopper sees
      one price on the item page and is totalled at the higher shelf price in the cart.
    traces:
      - path: legacy-source/app/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 96
        line_end: 102
