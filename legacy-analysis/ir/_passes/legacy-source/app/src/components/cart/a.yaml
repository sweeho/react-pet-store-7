    requirement: >
      The system SHALL represent each cart line with the item identifier, its product identifier,
      category, product name, item attribute (variant description), the quantity, and the unit price,
      and SHALL compute the line total as quantity multiplied by unit price.
    plain_text: >
      Each line in the cart shows which item it is (with its product, category, name and variant),
      how many are wanted, the price of one, and the line total (quantity times price).
    technical_note: >
      CartItem is a Serializable value object built in ShoppingCartLocalEJB.getItems() from the catalog
      Item; getTotalCost() returns quantity * unitCost as a Java double. The cart itself stores only
      itemId -> quantity; all other fields are read from the catalog when the cart is listed.
    confidence: high
    confidence_basis: >
      The fields are declared in CartItem and populated field-by-field in getItems(); the line-total
      formula is in CartItem.getTotalCost() and the same product is recomputed inline in getSubTotal().
      Two places in this module agree.
    risk_class: financial
    interface: false
    basis: >
      CartItem constructor and getTotalCost(); getItems() conversion from catalog Item to CartItem.
    traces:
