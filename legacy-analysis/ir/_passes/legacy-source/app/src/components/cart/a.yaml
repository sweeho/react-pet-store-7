    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL add an item to the cart with a quantity of 1.
      GIVEN the item is already in the cart with any quantity
      WHEN the customer adds the same item again
      THEN the cart SHALL hold that item once, with its quantity reset to 1 (not incremented).
    plain_text: >
      Adding an item puts one of it in the cart. Adding an item that is already in the cart does not
      add another one; it sets the quantity back to one.
    technical_note: >
      ShoppingCartLocalEJB.addItem(String) does cart.put(itemID, new Integer(1)) on a HashMap keyed by
      item id, so a repeat add overwrites the existing quantity. Exposed on ShoppingCartLocal; called by
      the petstore CartEJBAction (outside this shard).
    confidence: medium
    confidence_basis: >
      One clear place (addItem). The overwrite-to-1 behaviour follows directly from HashMap.put; no
      test, comment or document states whether this was intended.
    risk_class: financial
    interface: false
    basis: >
      addItem(String) writes quantity 1 under the item id key, replacing any existing entry.
