      WHEN authentication succeeds the system SHALL mark the session as signed on, record the user name in the session, and redirect the user to the originally requested resource; WHEN it fails the system SHALL redirect to the configured sign-on error page.
    plain_text: >
      After a successful sign-in the shopper is taken back to the page they originally asked for; after a failed one they see the sign-in error page.
    technical_note: >
      SignOnFilter.validateSignOn sets session attributes j_signon_username and j_signon (Boolean true), then redirects to session attribute j_signon_original_url, else to the error page from signon-config.xml.
