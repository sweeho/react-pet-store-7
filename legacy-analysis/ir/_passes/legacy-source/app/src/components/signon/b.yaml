  - record_key: SIGNON-REQ-0004
    kind: requirement
    capability_key: sign-on
    requirement: >
      WHEN a sign-on form is submitted with the remember-user-name option, the system SHALL store the user name in a cookie lasting 2678400 seconds (31 days); WHEN the option is absent, the system SHALL expire any existing sign-on cookie.
    plain_text: >
      Shoppers can ask the site to remember their user name for about a month; leaving the option off clears it.
    technical_note: >
      Cookie bp_signon, maxAge 2678400, set before authentication is checked, so it is set even when the sign-on fails. The comment says one month; 31 days.
    confidence: medium
    confidence_basis: One place; the literal is commented but not configured.
    risk_class: presentational
    basis: Filter cookie handling.
    interface: false
    traces:
