  - record_key: SIGNON-REQ-0003
    kind: requirement
    capability_key: sign-on
    requirement: >
      WHEN a user who is not signed on requests a resource whose URL exactly equals a protected URL pattern from the sign-on configuration, the system SHALL remember the requested URL and present the sign-on page instead; all other requests, and all requests from signed-on users, SHALL pass through.
    plain_text: >
      Pages on the protected list (customer account, customer action, enter order information, sign-on welcome) require sign-in; everything else is open.
    technical_note: >
      SignOnFilter.doFilter compares the path after the context root with url-pattern values loaded by SignOnDAO from WEB-INF/signon-config.xml. Match is exact string equality (no wildcards). The signon-config.xml shown is the petstore storefront's. auth-constraint roles are parsed into ProtectedResource but never checked by the filter.
    confidence: high
    confidence_basis: Enforced by the filter and declared in configuration (two places).
    risk_class: regulated
    basis: Filter plus config.
    interface: false
    traces:
