records:
  - record_key: SIGNON-REQ-0001
    kind: requirement
    capability_key: sign-on
    requirement: >
      The system SHALL authenticate a sign-on attempt by looking up the user by user name and comparing the supplied password for exact equality with the stored password; an unknown user name SHALL fail authentication.
    plain_text: >
      A shopper signs in with a user name and password; the sign-in succeeds only if the user exists and the password matches exactly.
    technical_note: >
      SignOnEJB.authenticate finds UserEJB by primary key (user name); FinderException returns false; UserEJB.matchPassword does String.equals on the stored password (plain text, case-sensitive).
    confidence: medium
    confidence_basis: >
      Clear in one flow (session bean plus entity bean), no test or document corroborating. Not graded high because it is a single code path.
    risk_class: regulated
    basis: Authentication logic in session and entity beans.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
              public boolean authenticate(String userName, String password) {
                  try {
                      UserLocal user = ulh.findByPrimaryKey(userName);
                      return user.matchPassword(password);
                  } catch (FinderException fe) {
                      return false; // User not found, so authentication failed.
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |
              public boolean matchPassword(String password) {
                  return password.equals(getPassword());
              }
    stack_metadata:
      framework: J2EE
      ejb.bean: SignOnEJB, UserEJB
