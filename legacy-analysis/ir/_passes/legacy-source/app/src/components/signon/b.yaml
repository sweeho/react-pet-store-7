  - record_key: SIGNON-REQ-0006
    kind: workflow
    capability_key: customer-accounts
    requirement: >
      WHEN a new-user form is submitted with user name and password, the system SHALL create the user credentials and redirect onward; WHEN creation is rejected, the system SHALL redirect to the user creation error page.
    plain_text: >
      A visitor can register sign-in credentials; if they are refused the visitor sees a user-creation error page.
    technical_note: >
      CreateUserServlet.doPost calls SignOnEJB.createUser; on CreateException redirects to user_creation_error.jsp. createUser is declared unchecked (no role required) in ejb-jar.xml. The success redirect lines are partly redacted in the extracted source, so the success target is not readable. CreateUserServlet is a servlet; its URL mapping is not in this module, so reachability is unconfirmed.
    confidence: low
    confidence_basis: Success path is redacted; servlet mapping not seen in this module.
    dispute:
      reason: unresolved-reachability
      detail: >
        No web.xml mapping for CreateUserServlet was in this shard. A web.xml mapping (likely in a storefront app) would settle it.
    risk_class: regulated
    basis: Servlet and ejb-jar method-permission.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/CreateUserServlet.java
        line_start: 59
