  - record_key: SIGNON-ENT-0001
    kind: entity
    capability_key: sign-on
    requirement: >
      The system SHALL keep a user credential record keyed by unique user name, holding the password.
    plain_text: >
      Each sign-in account has a unique user name and a password.
    technical_note: >
      UserEJB container-managed entity, primkey userName, cmp fields userName and password; container transaction Required; finder findAllUsers. Password is stored and compared in plain text.
    confidence: high
    confidence_basis: Declared in ejb-jar.xml and implemented in the bean.
    risk_class: regulated
    basis: CMP declaration.
    interface: false
    traces:
      - path: legacy-source/app/src/components/signon/src/ejb-jar.xml
        line_start: 47
        line_end: 65
        excerpt: |
          <ejb-name>UserEJB</ejb-name> ... <field-name>password</field-name> ... <primkey-field>userName</primkey-field>
    stack_metadata:
      ejb.bean: UserEJB
      ejb.transaction: Required
      db.object: User (abstract schema)
