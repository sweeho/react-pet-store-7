findings:
  - kind: ambiguity
    path: legacy-source/app/src/components/signon
    description: >
      legacy-source is absent from the worktree (it was removed from later commits). Read from commit 0683ff9 instead. Several lines (password literal and CreateUserServlet success path, MAX_PASSWD_LENGTH) are redacted in the source, so those values could not be read. No documents under legacy-analysis/sources were available.
