records:
  - record_key: ORDER-FULFILLMENT-ENTITY-0001
    kind: entity
    capability_key: order-fulfillment
    requirement: The system SHALL keep exactly one process-manager record per order, identified by the order id, holding the order's current status string.
    confidence: high
    confidence_basis: Declared in the deployment descriptor (primkey, two persistent fields) and in the abstract bean accessors; two places.
    risk_class: operational
    basis: Entity bean with persistent fields status and orderId, primary key orderId.
    plain_text: Each order has one tracking record that holds its current status.
    technical_note: ManagerEJB is a container-managed entity; orderId is the primary key (String).
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/ejb-jar.xml
        line_start: 57
        line_end: 65
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>status</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>orderId</field-name>
          </cmp-field>
          <primkey-field>orderId</primkey-field>
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/manager/ejb/ManagerEJB.java
        line_start: 235
        line_end: 239
        excerpt: |
          public abstract String getOrderId();
    stack_metadata:
      framework: EJB 2.x CMP
      ejb.bean: ManagerEJB
  - record_key: ORDER-FULFILLMENT-REQ-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: The system SHALL create the status record for an order with an initial status supplied by the caller, and SHALL reject creation if a record for that order id already exists.
    confidence: medium
    confidence_basis: Creation is read in one clear place; the duplicate rejection is implied by the primary key and CreateException, not seen explicitly.
    risk_class: operational
    basis: createManager delegates to entity create with orderId and status; no default status is applied here.
    plain_text: When an order is registered, its status record starts with the status given by the caller.
    technical_note: ProcessManagerEJB.createManager -> ManagerLocalHome.create; ejbCreate returns null and sets both fields.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 66
        line_end: 68
        excerpt: |
          public void createManager(String orderId, String status) throws CreateException {
            ManagerLocal manager = mlh.create(orderId, status);
          }
    stack_metadata:
      framework: EJB 2.x
      ejb.bean: ProcessManagerEJB
      ejb.transaction: Required (Manager create)
  - record_key: ORDER-FULFILLMENT-REQ-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: The system SHALL update the stored status of an existing order to a caller-supplied value, and SHALL fail when no record exists for the order id.
    confidence: medium
    confidence_basis: One clear place. No validation of the new status or of the transition is performed.
    risk_class: operational
    basis: updateStatus looks up by primary key and sets the status; any string is accepted.
    plain_text: The status of an order can be changed, but only for an order that is already registered.
    technical_note: ProcessManagerEJB.updateStatus; FinderException propagates when not found. No state-machine enforcement.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 73
        line_end: 76
        excerpt: |
          public void updateStatus(String orderId, String status) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            manager.setStatus(status);
          }
    stack_metadata:
      ejb.bean: ProcessManagerEJB
  - record_key: ORDER-FULFILLMENT-REQ-0003
    kind: requirement
    capability_key: order-fulfillment
    requirement: The system SHALL return the current status of an order by order id, and SHALL fail when the order is unknown.
    confidence: medium
    confidence_basis: One clear place.
    risk_class: operational
    basis: getStatus finds by primary key and returns the status.
    plain_text: The current status of any registered order can be looked up.
    technical_note: ProcessManagerEJB.getStatus.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 81
        line_end: 84
        excerpt: |
          public String getStatus(String orderId) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            return manager.getStatus();
          }
    stack_metadata:
      ejb.bean: ProcessManagerEJB
  - record_key: ORDER-APPROVAL-REQ-0001
    kind: requirement
    capability_key: order-approval
    requirement: The system SHALL return the set of orders whose status exactly equals a given status value, without duplicates.
    confidence: high
    confidence_basis: Query declared in the descriptor and exposed by the session bean; two places.
    risk_class: operational
    basis: Used to list orders in a given status (for example pending orders awaiting approval); callers are outside this module, so the use is inferred.
    plain_text: Staff can list all orders currently in a given status, such as those waiting for approval.
    technical_note: EJB-QL SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1 via findOrdersByStatus.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/ejb-jar.xml
        line_start: 78
        line_end: 78
        excerpt: |
          <ejb-ql>SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1</ejb-ql>
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 89
        line_end: 91
        excerpt: |
          public Collection getOrdersByStatus(String status) throws FinderException {
              return mlh.findOrdersByStatus(status);
          }
    stack_metadata:
      ejb.bean: ProcessManagerEJB
      db.object: Manager
  - record_key: ORDER-FULFILLMENT-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: The system SHALL recognise the order statuses PENDING, APPROVED, DENIED, SHIPPED_PART and COMPLETED.
    confidence: medium
    confidence_basis: Constants read in one place; the user guide lists four of five statuses, and nothing in this module enforces the set.
    risk_class: operational
    basis: Status name constants with comments describing each.
    plain_text: An order is pending, approved, denied, partly shipped or completed.
    technical_note: OrderStatusNames constants. The status column is a free string, so the set is a convention only.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 164
        line_end: 178
        excerpt: |
          public static final String PENDING = "PENDING";
          public  static final String APPROVED = "APPROVED";
          public  static final String DENIED = "DENIED";
          public  static final String SHIPPED_PART = "SHIPPED_PART";
          public  static final String COMPLETED = "COMPLETED";
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        line_start: 79
        line_end: 84
        excerpt: |
          5. Order status
          StatusMeaning
          PENDINGWaiting for the administrator to approve or deny
          APPROVEDApproved and sent to the Supplier, not yet fully invoiced
          DENIEDRefused by the administrator
          COMPLETEDAll lines shipped and invoiced
    stack_metadata:
      framework: EJB 2.x
  - record_key: ORDER-FULFILLMENT-INT-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: The system SHALL allow a transition step to be loaded by configured class name and SHALL fail with a transition error when the class cannot be found or instantiated.
    confidence: low
    confidence_basis: Factory and interface are read, but no caller or workflow configuration exists in this module; reachability is unknown.
    dispute:
      reason: unresolved-reachability
      detail: No caller of TransitionDelegateFactory is in this module. Searching the wider tree for users of the factory or TransitionDelegate implementations would settle it.
    risk_class: operational
    basis: Reflection factory and a delegate interface with setup() and doTransition(TransitionInfo).
    plain_text: Workflow steps can be plugged in by configuration; a step that cannot be loaded causes an error.
    technical_note: Class.forName(className).newInstance() wrapped in TransitionException.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegateFactory.java
        line_start: 317
        line_end: 325
        excerpt: |
          public TransitionDelegate getTransitionDelegate(String className) throws TransitionException {
            TransitionDelegate td = null;
            try {
              td = (TransitionDelegate)Class.forName(className).newInstance();
            } catch(Exception e) {
              throw new TransitionException(e);
            }
            return td;
          }
    stack_metadata:
      framework: EJB 2.x
