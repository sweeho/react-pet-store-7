      db.object: Manager
  - record_key: ORDER-FULFILLMENT-WF-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL support pluggable transition handlers, instantiated by class name, that receive an XML message or batch of XML messages and perform a status transition, failing with a transition error wrapping any instantiation problem.
    confidence: low
    confidence_basis: >
      Only the interface, factory and info holder are in this module; no implementations or callers were seen here, so live use is unproven.
    dispute:
      reason: unresolved-reachability
      detail: >
        No caller of TransitionDelegateFactory was checked across the whole tree in this pass; a grep of other components would settle whether it is used.
    risk_class: operational
    basis: Factory uses reflection by class name.
    plain_text: >
      The system has a hook for plugging in custom handlers that move orders between statuses in response to incoming messages.
    technical_note: >
      TransitionDelegateFactory.getTransitionDelegate uses Class.forName(...).newInstance(); TransitionDelegate has setup() and doTransition(TransitionInfo).
    interface: true
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegateFactory.java
        line_start: 46
        line_end: 56
        excerpt: |
            public TransitionDelegateFactory() { }
          
            public TransitionDelegate getTransitionDelegate(String className) throws TransitionException {
              TransitionDelegate td = null;
              try {
                td = (TransitionDelegate)Class.forName(className).newInstance();
              } catch(Exception e) {
                throw new TransitionException(e);
              }
              return td;
            }
    stack_metadata:
      framework: EJB 2.0
