  - record_key: ORDER-FULFILLMENT-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL recognise the order statuses PENDING, APPROVED, DENIED, SHIPPED_PART and COMPLETED.
    confidence: medium
    confidence_basis: >
      Constants are in one place; the user guide lists four of the five (no SHIPPED_PART). Allowed transitions are not enforced here.
    risk_class: operational
    basis: Status name constants with comments; guide status table.
    plain_text: >
      An order is either waiting for approval, approved, denied, partly shipped, or completed.
    technical_note: >
      OrderStatusNames constants. No transition validation exists in this module: any status string is accepted by updateStatus.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 50
        line_end: 65
        excerpt: |
              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";
          
              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";
          
              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";
          
          
              /** for orders that have been partially completed*/
              public  static final String SHIPPED_PART = "SHIPPED_PART";
          
          
              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";
      - path: legacy-analysis/sources/pdf/petstore-user-guide/extracted.md
        anchor: p1
        excerpt: "5. Order status: PENDING, APPROVED, DENIED, COMPLETED"
    stack_metadata:
      framework: EJB 2.0
  - record_key: ORDER-FULFILLMENT-REQ-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL allow an order's status record to be created with an initial status, updated to a new status, and read back by order id, each within a transaction.
    confidence: high
    confidence_basis: >
      Session bean methods plus descriptor transaction attributes (Required) and unchecked permissions.
    risk_class: operational
    basis: createManager, updateStatus, getStatus delegate to the entity; descriptor sets Required.
    plain_text: >
      The system can record a new order's status, change it later, and look it up. Anyone calling inside the application may do this.
    technical_note: >
      ProcessManagerEJB stateless session bean; updateStatus/getStatus throw FinderException if the order is unknown; createManager throws CreateException (e.g. duplicate id). Methods are unchecked (no role restriction).
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 66
        line_end: 84
        excerpt: |
              public void createManager(String orderId, String status) throws CreateException {
                ManagerLocal manager = mlh.create(orderId, status);
              }
          
              /**
               * Business method used to keep track of an order in the workflow process
               */
              public void updateStatus(String orderId, String status) throws FinderException {
                ManagerLocal manager = mlh.findByPrimaryKey(orderId);
                manager.setStatus(status);
              }
          
              /**
               * Business method used to keep track of an order in the workflow process
               */
              public String getStatus(String orderId) throws FinderException {
                ManagerLocal manager = mlh.findByPrimaryKey(orderId);
                return manager.getStatus();
              }
    stack_metadata:
      framework: EJB 2.0
      ejb.bean: ProcessManagerEJB
      ejb.transaction: Required
  - record_key: ORDER-FULFILLMENT-REQ-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL list the orders whose current status equals a given status exactly.
    confidence: high
    confidence_basis: >
      Query declared in descriptor and exposed by the session bean.
    risk_class: operational
    basis: EJB-QL finder on status equality.
    plain_text: >
      The system can list all orders that are currently in a chosen status, such as all pending orders.
    technical_note: >
      findOrdersByStatus EJB-QL: SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1.
    interface: false
    traces:
      - path: legacy-source/app/src/components/processmanager/src/ejb-jar.xml
        line_start: 71
        line_end: 78
        excerpt: |
                  <description></description>
                  <query-method>
                    <method-name>findOrdersByStatus</method-name>
                    <method-params>
                      <method-param>java.lang.String</method-param>
                    </method-params>
                  </query-method>
                  <ejb-ql>SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1</ejb-ql>
      - path: legacy-source/app/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 89
        line_end: 91
        excerpt: |
              public Collection getOrdersByStatus(String status) throws FinderException {
                  return mlh.findOrdersByStatus(status);
              }
