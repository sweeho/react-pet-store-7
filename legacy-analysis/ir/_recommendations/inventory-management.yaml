recommendations:
  - record_key: INV-BR-0004
    recommendation: edit
    confidence: low
    reason: >
      Pass A infers the failure from a missing catch for NumberFormatException; the visible page and
      rollback of earlier rows depend on container behaviour. Confirm what the code does, then decide
      in the defect register whether rejecting with a clear message is the rebuild behaviour.
    edited_requirement: >
      GIVEN a ticked row whose new quantity is not a whole number WHEN inventory changes are submitted
      THEN the system SHALL reject the submission with an error and SHALL NOT show the success page.
  - record_key: INV-WF-0005
    recommendation: accept
    confidence: medium
    reason: >
      The servlet and facade code show the transaction sequence and the success text. The user guide
      says the Supplier notifies the OPC after every update, which differs in wording from the code
      that publishes invoices only; the conflict goes to Intent for the Business Owner.
