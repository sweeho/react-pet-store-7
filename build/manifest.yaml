capabilities:
  - slug: sign-on
    title: "Sign-on"
    order: 1
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-sign-on
      specCapabilities:
        - sign-on
    canvas:
      problem: "Account, checkout and supplier inventory screens must be restricted to known users; the legacy rules (plain-text credentials, filter-based protection, timeouts) need to be recorded."
      solution: "Build authentication for the storefront and the supplier administrator, protected-resource rules, sign-out, idle timeout and the sign-in screens."
      userStories:
        - "As a returning customer, I want to sign in with my user name and password, so that I can reach my account and check out."
        - "As a supplier administrator, I want to sign in to the inventory application, so that I can update stock."
      acceptanceCriteria:
        - "Sign-on credential record — Duplicate user name: the creation is rejected"
        - "User creation limits — Forbidden character: creation is rejected"
        - "Credential authentication — Matching password: authentication succeeds"
        - "Sign-on outcome — Success after a protected request: the session is signed on and the visitor is taken to the account page"
        - "Customer context on sign-on — Preferred language applied: the storefront and cart use Japanese"
        - "Storefront protected resources — Protected page, not signed on: the sign-in screen is shown and the requested address is remembered"
        - "Remember user name — Option selected: the cookie is set for 31 days, even if authentication fails"
        - "Storefront sign-out — Sign out: the cart is empty, the visitor is not signed on, Japanese is kept and the message is shown"
        - "Storefront idle timeout — Idle session: the session has expired"
        - "Supplier administrator access — Not signed in: the supplier sign-in screen is shown"
        - "Supplier logout — Logout: the session ends and a sign-in link is shown"
        - "Supplier idle timeout — Idle supplier session: the user must sign in again"
      outOfScope:
        - "Customer registration data (see customer-accounts)"
        - "Password hashing or other security improvements not present in the legacy system"
      risksAssumptions: []
      techStack: []
      affectedCode: []
      screens:
        - "Storefront sign-in screen: returning-customer form (user name, password, Remember My User Name checkbox) and a new-customer sign-up form; user name pre-filled and password blank when a name is remembered, otherwise both fields pre-filled with the sample credentials j2ee/j2ee; a failed sign-in shows \"There were errors signing you in...\" and offers to try again"
        - "Supplier sign-in screen: asks for user id and password pre-filled with supplier/supplier; rejected credentials show \"You could not be authenticated with the information provided. Please check your Username and Password.\" with a link back to sign in"
        - "Storefront page header: search box, links to Account and Cart, and Sign out when the visitor is signed on or Sign in otherwise"
    evidence:
      irRefs: [SIGNON-REQ-0001, SIGNON-REQ-0002, SIGNON-REQ-0003, SIGNON-REQ-0004, SIGNON-REQ-0005, SIGNON-ENT-0001, CUSTACC-REQ-0002, SO-REQ-0001, SO-SCR-0002, SO-REQ-0003, SO-BR-0004, SIGN-BR-0001, SIGN-BR-0002, SIGN-BR-0003, SIGN-SCR-0004, SGN-RULE-0001, SIGN-REQ-0001, SIGN-SCR-0002, SIGN-BR-0004, SIGN-BR-0005, SIGN-BR-0006, SIGN-BR-0007, SIGN-SCR-0006, SIGN-ENT-0001]
