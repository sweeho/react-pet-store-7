  - slug: checkout
    title: "Checkout"
    order: 6
    dependsOn: [shopping-cart, customer-accounts]
    priority: 0
    change:
      dir: openspec/changes/sx-checkout
      specCapabilities:
        - checkout
    canvas:
      problem: "A signed-on shopper turns a cart into a purchase order."
      solution: "Build billing and shipping capture, order identifier generation, order total, purchase order creation and the order hand-off."
      userStories:
        - "As a signed-on shopper, I want to enter billing and shipping details and place my order, so that I receive my pets."
      acceptanceCriteria:
        - "Order information screen — Form displayed to a signed-on shopper: both blocks are shown with the fields listed above, filled from the account"
        - "Order complete screen — Order placed: it shows \"Your Order is Complete\", the order id and the billing e-mail address"
        - "General error screen — Unexpected failure: the error message, the technical trace and a request to tell the administrator are shown"
        - "Order placement — Successful order: a purchase order with all listed data is created, sent for processing, the cart is emptied and the complete page is shown"
        - "Empty cart refusal — Empty or re-submitted order: no order is created and \"The Shopping Cart is Empty and the order could not be placed.\" is shown, explaining that a re-submitted order has already been placed"
        - "Order total calculation — Two lines: the total is 25.50 and the lines are numbered 0 and 1"
        - "Payment card attached to orders — Any customer: the order carries the fixed card, not the stored one"
        - "Checkout required contact fields — Blank field reaching the server: legacy behaviour records the missing field without telling the shopper and continues (suspected defect, awaiting a decision)"
        - "Order identifier generation — First identifier for a prefix: a counter is created at 0 and \"10011\" is returned"
        - "Identifier counter storage — Duplicate counter name: the store is rejected"
        - "Purchase order storage — Order missing its card: it is rejected"
        - "Order line quantity constraints — Zero quantity: it is rejected"
      outOfScope:
        - "Approval and fulfilment of the order"
        - "E-mail composition (see order-notifications)"
      risksAssumptions: []
      techStack: []
      affectedCode: []
      screens:
        - "Order information screen: asks for billing and shipping contact details (first and last name, street lines 1-2, city, state/province, postal code, country, telephone, e-mail), pre-fills both from the signed-on customer's account, and refuses to submit in the browser while any required field (all except street line 2 and the selects) is empty"
        - "Order complete screen: after an order is placed, shows the order id and states that a confirmation e-mail will be sent to the billing e-mail address"
        - "General error screen: shown when a request fails unexpectedly; displays the error message and technical error trace and asks the user to notify the administrator (reachability unresolved in legacy)"
