        - "As a shopper, I want to browse categories, products and items, so that I can find a pet."
        - "As a shopper, I want to search by keyword, so that I can find a pet quickly."
      acceptanceCriteria:
        - "Catalog hierarchy and product identity — Product with unknown category: the product is rejected"
        - "Product details per locale — Product row without name: it is rejected"
        - "Item details per locale — Item row missing a price: it is rejected"
        - "Category, product and item hierarchy — Item belongs to one product: exactly one product is returned"
        - "Catalog navigation and paged lists — List opened without paging parameters: items 1 and 2 are shown with a Next link and no Previous link"
        - "Home page category entry points — Open a category from the home page: the product list of the Dogs category is displayed"
        - "Item detail screen — Item displayed: name, attribute, image, List Price, Your Price and an Add to Cart link are shown"
        - "Category sidebar — Sidebar displayed: 5 category links are shown, each opening that category's product list"
        - "Price shown per list — Price in item list versus search: the item list shows 20.00 and the search results show 15.00"
        - "Keyword search — Any keyword matches: items matching either keyword are returned"
        - "Storefront locales — Default locale: en_US catalog content is shown"
        - "Language switching — Switch to Chinese: the page and the cart are shown in zh_CN"
      outOfScope:
        - "Cart and checkout behaviour"
        - "Catalog data loading"
      risksAssumptions: []
      techStack: []
      affectedCode: []
      screens:
