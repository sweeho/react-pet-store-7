        - "Default profile preferences — Defaults applied: language is en_US, favourite category is empty, my-list is on and banner is on"
        - "Account status values — Status on creation: its status is \"active\""
        - "Customer data model — Customer record read: the account, contact, address, card and profile are available"
        - "Cascading customer removal — Customer deleted: all dependent records are removed"
        - "List customers — List: three customers are returned"
