  - slug: catalog-data-maintenance
    title: "Catalog data maintenance"
    order: 3
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-catalog-data-maintenance
      specCapabilities:
        - catalog-data-maintenance
    canvas:
      problem: "Legacy applications seed their own catalog, user, customer and supplier stock data and run an integrity check on the catalog."
      solution: "Build the initial data load for the storefront and supplier and the catalog integrity checks."
      userStories:
        - "As an operator, I want the catalog and sample users loaded, so that the store is usable on first start."
        - "As a catalog owner, I want integrity and quality flags reported, so that bad data is found."
      acceptanceCriteria:
        - "Initial seed content — Initial load on an empty store: the four users with matching customers and the five categories with details in three locales exist"
        - "Storefront data load — Already populated: nothing is changed"
        - "Data load access and redirect — Load fails with error page given: the caller is redirected to the error page"
        - "Storefront entry data load — Entering the storefront: the wait message is shown, the storefront load runs, then the supplier load runs with the same force setting"
        - "Catalog item pricing storage — Item detail stored: list price and unit cost are held as 2-place decimals and both are required"
        - "No price-versus-cost constraint — Price below cost: it is accepted"
        - "Supplier stock load — Stock already present: no stock is changed"
        - "Supplier seed stock — Seeded stock: 29 items EST-1..EST-29 each have quantity 10000"
        - "Supplier load page and redirects — Successful supplier load: the user is redirected to the success page"
        - "Catalog structure integrity check — Empty category: the job fails"
        - "Catalog data quality flags — Item without inventory: the item is flagged under C5 and category and item totals are logged"
      outOfScope:
        - "Interactive catalog editing (not present in legacy)"
      risksAssumptions: []
      techStack: []
