  - slug: order-approval
    title: "Order approval"
    order: 7
    dependsOn: [checkout]
    priority: 0
    change:
      dir: openspec/changes/sx-order-approval
      specCapabilities:
        - order-approval
    canvas:
      problem: "Placed orders must be approved or denied before fulfilment."
      solution: "Build automatic approval by locale, administrator batch decisions and status rules."
      userStories:
        - "As an administrator, I want to approve or deny pending orders, so that only accepted orders are fulfilled."
      acceptanceCriteria:
        - "Batch approval decisions — Mixed batch: both statuses are updated, one supplier purchase order is sent for the approved order only, and both decisions are passed on for customer notification"
        - "en_US automatic approval — Below the limit: it is approved automatically"
        - "ja_JP automatic approval — Below and at the limit: the first is approved automatically and the second stays PENDING"
        - "No automatic approval for other locales — Chinese locale order: it stays PENDING until an administrator approves or denies it"
        - "Initial pending state and shared approval path — Automatic approval is treated like an administrator approval: it is first recorded PENDING, then approved through the decision path, so the supplier receives the order and the customer is notified"
        - "Decisions apply only to pending orders — Decision on an already decided order: the decision is ignored, no status change is made, no supplier order is sent and no customer notice is produced for it"
        - "Order status values — Unlisted status: the store is rejected"
        - "Approval document format — Empty batch: it is rejected as invalid"
      outOfScope:
        - "Fulfilment and shipping"
      risksAssumptions: []
      techStack: []
      affectedCode: []
