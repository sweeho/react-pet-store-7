        - "Item detail screen: shows the item's name and attribute, its image, a List Price from the item's list price and a Your Price from the item's unit cost, both formatted as currency for the page locale, and an Add to Cart link"
        - "Home page: lets the shopper open each of the five pet categories (Fish, Dogs, Reptiles, Cats, Birds) from a clickable image map, alongside a sidebar of catalog categories"
