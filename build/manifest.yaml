        - "Status wording and subject language — Denied order in Chinese: the body carries the Chinese refusal wording and the subject is English"
        - "Hand-off to mail service — Two e-mails: two separate messages are passed to the mail service"
        - "Asynchronous message hand-off — Message queued: one text message is placed on the queue"
        - "Asynchronous send failure — Send fails: the caller receives an error and the connection is released"
        - "Asynchronous send transaction and access — Caller rolls back: the message is not delivered"
        - "Named resource lookup — Queue lookup: the resolved queue is returned"
        - "Lookup caching — Repeated name: the cached object is returned"
        - "Configuration entries not cached — Switch changed: the new value is returned"
      outOfScope:
        - "Order decisions (see order-approval)"
      risksAssumptions: []
      techStack: []
