  - slug: order-notifications
    title: "Order notifications"
    order: 10
    dependsOn: [order-approval]
    priority: 0
    change:
      dir: openspec/changes/sx-order-notifications
      specCapabilities:
        - order-notifications
    canvas:
      problem: "Customers are e-mailed about order status, shipment and completion."
      solution: "Build status, shipment and completion e-mails, locale templates, asynchronous hand-off and named resource lookup."
      userStories:
        - "As a customer, I want e-mail about my order, so that I know its progress."
      acceptanceCriteria:
        - "Order status e-mail — Switch on: one e-mail with subject \"Java Pet Store Order Status: <order id>\" is sent to the order's e-mail address"
